<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://www.w3.org/1998/Math/MathML" id="S2.SS3.p2.pic1" class="ltx_picture" height="130.95" overflow="visible" version="1.1" viewBox="0 0 550 130.95" width="550"><ns0:style>
  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Keep the announcement text dark on the Open-Blue band in both colour themes
     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,130.95) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#0000BF;" fill="#0000BF" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 125.05 C 0 128.31 2.64 130.95 5.91 130.95 L 544.09 130.95 C 547.36 130.95 550 128.31 550 125.05 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F2F2FF;" fill="#F2F2FF" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 125.05 C 1.97 127.22 3.73 128.98 5.91 128.98 L 544.09 128.98 C 546.27 128.98 548.03 127.22 548.03 125.05 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><ns0:foreignObject style="--ltx-fo-width:36.62em;--ltx-fo-height:7.28em;--ltx-fo-depth:0.19em;font-size:10pt;" height="103.39" overflow="visible" transform="matrix(1 0 0 -1 0 100.7)" width="506.72"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S2.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<html:span id="S2.SS3.p2.pic1.1.1" class="ltx_p"><html:span id="S2.SS3.p2.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">LAWA runs a moving window at a predetermined interval to collect <ns2:math id="S2.SS3.p2.pic1.m1" class="ltx_Math" alttext="\mathsf{k}" display="inline" intent=":literal"><ns2:semantics><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝗄</ns2:mi><ns2:annotation encoding="application/x-tex">\mathsf{k}</ns2:annotation></ns2:semantics></ns2:math> latest checkpoints on sequence of saved checkpoints <ns2:math id="S2.SS3.p2.pic1.m2" class="ltx_Math" alttext="\boldsymbol{\theta}_{t}" display="inline" intent=":literal"><ns2:semantics><ns2:msub><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝜽</ns2:mi><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</ns2:mi></ns2:msub><ns2:annotation encoding="application/x-tex">\boldsymbol{\theta}_{t}</ns2:annotation></ns2:semantics></ns2:math>. The LAWA derived checkpoints are computed as <ns2:math id="S2.SS3.p2.pic1.m3" class="ltx_Math" alttext="\boldsymbol{\theta}^{\text{LAWA}}_{t}:=\frac{1}{\mathsf{k}}\sum_{s=t-\mathsf{k}}^{t}\boldsymbol{\theta}_{s}" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:msubsup><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝜽</ns2:mi><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</ns2:mi><ns2:mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">LAWA</ns2:mtext></ns2:msubsup><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">:=</ns2:mo><ns2:mrow><ns2:mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><ns2:mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</ns2:mn><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝗄</ns2:mi></ns2:mfrac><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:mrow><ns2:msubsup><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝗄</ns2:mi></ns2:mrow></ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</ns2:mi></ns2:msubsup><ns2:msub><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝜽</ns2:mi><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</ns2:mi></ns2:msub></ns2:mrow></ns2:mrow></ns2:mrow><ns2:annotation encoding="application/x-tex">\boldsymbol{\theta}^{\text{LAWA}}_{t}:=\frac{1}{\mathsf{k}}\sum_{s=t-\mathsf{k}}^{t}\boldsymbol{\theta}_{s}</ns2:annotation></ns2:semantics></ns2:math> where <ns2:math id="S2.SS3.p2.pic1.m4" class="ltx_Math" alttext="\boldsymbol{\theta}_{t}" display="inline" intent=":literal"><ns2:semantics><ns2:msub><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝜽</ns2:mi><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</ns2:mi></ns2:msub><ns2:annotation encoding="application/x-tex">\boldsymbol{\theta}_{t}</ns2:annotation></ns2:semantics></ns2:math> the original checkpoints are sampled several training steps apart in the training process.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>