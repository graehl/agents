# Metadata manifest for surveys/llm-intelligence.
#
# Built and checked by the shared `related-work` engine (scripts/related-work
# in ~/agents; contract topics/research-survey.md): `related-work fetch` builds
# extracts under ./extract/<key>/, `related-work audit` reconciles this file
# against them, `related-work status` derives survey.md's grounding banner.
#
# One entry per paper the field map references. `verified: true` means the
# citation was checked against a fetched source THIS repo can regenerate;
# `verified: false` means it is pretrained-recall reconstruction and
# the arxiv/venue/year/authors must be confirmed on a grounded pass. Do not cite
# a verified:false entry as authoritative.
#
# arxiv ids on verified:false entries are best-recall and may be wrong — that is
# exactly what the grounded pass pins down. Fields: key, title, authors, venue,
# year, arxiv/url, grounded (source fetched?), verified (citation checked?),
# source (where a verified-but-ungrounded citation was checked), fetched (date
# or null), short + concept_page (once the paper earns a digest), cluster
# (survey.md section).
#
# Extracts are keyed by `key`, never by `short`: a short handle is assigned
# later, and rekeying would orphan every extract a concept page cites.

meta:
  field_slug: llm-intelligence
