# Metadata manifest for surveys/llm-intelligence.
#
# One entry per paper the field map references. `verified: true` means the
# citation was checked against a fetched source THIS repo can regenerate (see
# fetch.sh); `verified: false` means it is pretrained-recall reconstruction and
# the arxiv/venue/year/authors must be confirmed on a grounded pass. Do not cite
# a verified:false entry as authoritative.
#
# arxiv ids on verified:false entries are best-recall and may be wrong — that is
# exactly what the grounded pass pins down. Fields: key, title, authors, venue,
# year, arxiv/url, grounded (source fetched?), verified (citation checked?),
# fetched (date or null), cluster (survey.md section).

meta:
  field_slug: llm-intelligence
  coverage_cutoff: 2026-07-30
  grounding_mode: grounded-in-progress
  model_training_cutoff: 2026-01

