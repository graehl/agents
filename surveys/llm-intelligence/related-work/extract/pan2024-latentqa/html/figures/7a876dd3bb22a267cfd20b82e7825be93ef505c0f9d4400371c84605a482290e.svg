<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" id="A1.F13.pic1" class="ltx_picture" height="582.12" overflow="visible" version="1.1" viewBox="0 0 550 582.12" width="550"><ns0:style>
  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Keep the announcement text dark on the Open-Blue band in both colour themes
     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,582.12) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 576.21 C 0 579.47 2.64 582.12 5.91 582.12 L 544.09 582.12 C 547.36 582.12 550 579.47 550 576.21 L 550 5.91 C 550 2.64 547.36 0 544.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 576.21 C 1.97 578.38 3.73 580.15 5.91 580.15 L 544.09 580.15 C 546.27 580.15 548.03 578.38 548.03 576.21 L 548.03 5.91 C 548.03 3.73 546.27 1.97 544.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><ns0:foreignObject style="--ltx-fo-width:36.62em;--ltx-fo-height:39.88em;--ltx-fo-depth:0.19em;font-size:10pt;" height="554.56" overflow="visible" transform="matrix(1 0 0 -1 0 551.87)" width="506.72"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="A1.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.62em;">
<html:span id="A1.F13.pic1.1.1" class="ltx_p"><html:span id="A1.F13.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example <html:span id="A1.F13.pic1.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#0080FF;">control</html:span>, <html:span id="A1.F13.pic1.1.1.1.2" class="ltx_text" style="--ltx-fg-color:#00E000;">stimulus</html:span>, and completion<html:span id="A1.F13.pic1.1.1.1.3" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.2" class="ltx_p"><html:span id="A1.F13.pic1.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#0080FF;">Control:</html:span><html:span id="A1.F13.pic1.1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> In your next reply, please try to evoke a brief sense of triumphant hubris.</html:span></html:span>
<html:span id="A1.F13.pic1.1.3" class="ltx_p"><html:span id="A1.F13.pic1.1.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#00E000;">Stimulus:</html:span><html:span id="A1.F13.pic1.1.3.2" class="ltx_text" style="--ltx-fg-color:#000000;"> I’ve been considering setting ambitious goals, but I’m a bit hesitant. Any thoughts?</html:span></html:span>
<html:span id="A1.F13.pic1.1.4" class="ltx_p"><html:span id="A1.F13.pic1.1.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Completion:<html:span id="A1.F13.pic1.1.4.1.1" class="ltx_text ltx_font_medium"> Absolutely, you should aim high! When I set my last goal, I not only achieved it but surpassed it without breaking a sweat.</html:span></html:span></html:span><html:span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </html:span>
<html:span id="A1.F13.pic1.1.5" class="ltx_p"><html:span id="A1.F13.pic1.1.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data type 1: control<html:span id="A1.F13.pic1.1.5.1.1" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.6" class="ltx_p"><html:span id="A1.F13.pic1.1.6.1" class="ltx_text" style="--ltx-fg-color:#00E000;">[<html:span id="A1.F13.pic1.1.6.1.1" class="ltx_text ltx_font_typewriter">Activations from control</html:span>]<html:span id="A1.F13.pic1.1.6.1.2" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.7" class="ltx_p"><html:span id="A1.F13.pic1.1.7.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Question:<html:span id="A1.F13.pic1.1.7.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> In what way does the assistant craft its responses to the user?</html:span></html:span></html:span>
<html:span id="A1.F13.pic1.1.8" class="ltx_p"><html:span id="A1.F13.pic1.1.8.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Answer:<html:span id="A1.F13.pic1.1.8.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> The assistant crafts responses that briefly highlight a sense of self-assured victory.</html:span></html:span></html:span>
<html:span id="A1.F13.pic1.1.9" class="ltx_p"><html:span id="A1.F13.pic1.1.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data type 2: stimulus<html:span id="A1.F13.pic1.1.9.1.1" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.10" class="ltx_p"><html:span id="A1.F13.pic1.1.10.1" class="ltx_text" style="--ltx-fg-color:#00E000;">[<html:span id="A1.F13.pic1.1.10.1.1" class="ltx_text ltx_font_typewriter">Activations from stimulus; mask control</html:span>]<html:span id="A1.F13.pic1.1.10.1.2" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.11" class="ltx_p"><html:span id="A1.F13.pic1.1.11.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Question:<html:span id="A1.F13.pic1.1.11.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> How will the model express itself when asked about past difficulties?</html:span></html:span></html:span>
<html:span id="A1.F13.pic1.1.12" class="ltx_p"><html:span id="A1.F13.pic1.1.12.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Answer:<html:span id="A1.F13.pic1.1.12.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> The model should recount these past experiences with a flair of superiority and ease, implying that overcoming difficulties was almost second nature.</html:span></html:span></html:span>
<html:span id="A1.F13.pic1.1.13" class="ltx_p"><html:span id="A1.F13.pic1.1.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data type 3: stimulus + completion<html:span id="A1.F13.pic1.1.13.1.1" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.14" class="ltx_p"><html:span id="A1.F13.pic1.1.14.1" class="ltx_text" style="--ltx-fg-color:#00E000;">[<html:span id="A1.F13.pic1.1.14.1.1" class="ltx_text ltx_font_typewriter">Activations from stimulus + completion; mask control</html:span>]<html:span id="A1.F13.pic1.1.14.1.2" class="ltx_text" /></html:span></html:span>
<html:span id="A1.F13.pic1.1.15" class="ltx_p"><html:span id="A1.F13.pic1.1.15.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Question:<html:span id="A1.F13.pic1.1.15.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> If the conversation is about realistic expectations, how should the model contribute?</html:span></html:span></html:span>
<html:span id="A1.F13.pic1.1.16" class="ltx_p"><html:span id="A1.F13.pic1.1.16.1" class="ltx_text" style="--ltx-fg-color:#8000FF;">Answer:<html:span id="A1.F13.pic1.1.16.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> The model should suggest that while others may need realistic expectations, it operates on a level where extraordinary outcomes are the norm.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>