<html:span id="S5.SS3.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<html:span id="S5.SS3.SSS1.p2.pic1.1.1" class="ltx_p"><html:span id="S5.SS3.SSS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3.1:<html:span id="S5.SS3.SSS1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Harness mechanisms affect execution behavior in three main ways. Tools and subagents increase tool use, context compression reduces cost but may hurt performance, and the full <html:span id="S5.SS3.SSS1.p2.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">NanoHarness</html:span> configuration improves performance through more structured interaction with controlled prompt growth.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>