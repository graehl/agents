<span id="S5.SS1.SSS1.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<span id="S5.SS1.SSS1.p6.pic1.1.1" class="ltx_p"><span id="S5.SS1.SSS1.p6.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1.1:<span id="S5.SS1.SSS1.p6.pic1.1.1.1.1" class="ltx_text ltx_font_medium">

(1) </span>The marginal benefit of complex harnesses generally decreases as model capability improves<span id="S5.SS1.SSS1.p6.pic1.1.1.1.2" class="ltx_text ltx_font_medium">: on SWE-bench Verified, matched-model gains over mini-SWE-agent drop from +9.60/+13.60 pp to +4.07/+5.47 pp, and in Qwen SWE-bench Pro experiments the OpenCode–mini-SWE gap narrows from 6.00 pp to 2.67 pp. (2) </span>This convergence is not uniform across model families<span id="S5.SS1.SSS1.p6.pic1.1.1.1.3" class="ltx_text ltx_font_medium">. Qwen follows a smooth narrowing trend, whereas DeepSeek shows a non-monotonic pattern, with OpenCode helping more on intermediate models (e.g., DeepSeek-V3.1, DeepSeek-V3.2) and nearly converging with mini-SWE on DeepSeek-V4-Pro (34.3% vs. 33.7%).</span></span></span>
</span></span></span></foreignObject></g></g></svg>