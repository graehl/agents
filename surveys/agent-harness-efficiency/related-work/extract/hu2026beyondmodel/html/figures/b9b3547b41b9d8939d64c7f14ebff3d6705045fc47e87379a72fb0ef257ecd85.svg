<span id="S5.SS1.SSS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<span id="S5.SS1.SSS2.p4.pic1.1.1" class="ltx_p"><span id="S5.SS1.SSS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1.2:<span id="S5.SS1.SSS2.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium">

</span>The effectiveness of a harness is influenced not only by model capability, but also by task complexity and task type.<span id="S5.SS1.SSS2.p4.pic1.1.1.1.2" class="ltx_text ltx_font_medium"> For SWE-bench Pro, where the workflow is relatively fixed, the amount of code modification is small, and the task has received sustained attention over time, models generally demonstrate strong adaptability. As model capability improves, the additional gains brought by a complex harness (e.g., OpenCode) gradually diminish. In contrast, for newer and more complex SE tasks such as ProgramBench and GitTaskBench, complex harnesses can provide greater benefits to stronger models (e.g., Qwen3.7-Max and DeepSeek-V4-Pro).</span></span></span>
</span></span></span></foreignObject></g></g></svg>