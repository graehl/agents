<span id="S5.SS2.SSS1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<span id="S5.SS2.SSS1.p4.pic1.1.1" class="ltx_p"><span id="S5.SS2.SSS1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2.1:<span id="S5.SS2.SSS1.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Individual harness components have heterogeneous effects. Tool registry and task-specific subagents provide the most stable and substantial gains, planning and lazy skills offer smaller or model-dependent improvements, while context compression and general subagents can hurt performance on repository-generation tasks.</span></span></span>
