<html:span id="S5.SS2.SSS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<html:span id="S5.SS2.SSS2.p4.pic1.1.1" class="ltx_p"><html:span id="S5.SS2.SSS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2.2:<html:span id="S5.SS2.SSS2.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
The full <html:span id="S5.SS2.SSS2.p4.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">NanoHarness</html:span> configuration achieves the strongest performance among variants, improving over mini-SWE-agent on both models and outperforming any single component. Although <html:span id="S5.SS2.SSS2.p4.pic1.1.1.1.1.2" class="ltx_text ltx_font_smallcaps">NanoHarness</html:span> still slightly trails product-level harnesses such as OpenCode and Claude Code, it closes most of the gap with a lightweight modular design, suggesting that a compact set of representative components can reproduce much of the benefit of complex harnesses.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>