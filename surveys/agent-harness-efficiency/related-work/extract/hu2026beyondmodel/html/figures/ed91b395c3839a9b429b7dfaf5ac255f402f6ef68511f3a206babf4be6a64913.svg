<span id="S5.SS3.SSS2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.63em;">
<span id="S5.SS3.SSS2.p3.pic1.1.1" class="ltx_p"><span id="S5.SS3.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3.2:<span id="S5.SS3.SSS2.p3.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Harness mechanisms affect failure modes by regularizing probing behavior. On ProgramBench, effective components such as task-specific subagents reduce both excessive low-value probes and insufficient shallow validation. By combining these components, <span id="S5.SS3.SSS2.p3.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">NanoHarness</span> enables more stable behavioral exploration and helps avoid wasteful probing and premature implementation.</span></span></span>
</span></span></span></foreignObject></g></g></svg>