<html:span id="S5.SS4.p5.pic1.1.1" class="ltx_p"><html:span id="S5.SS4.p5.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 9:</html:span><html:span id="S5.SS4.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<html:span id="S5.SS4.p5.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Model switches are mostly reactive to rate limiting, compound turn boundary into near-total cache loss (<ns2:math id="S5.SS4.p5.pic1.m1" class="ltx_Math" alttext="\downarrow" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↓</ns2:mo><ns2:annotation encoding="application/x-tex">\downarrow</ns2:annotation></ns2:semantics></ns2:math>67%, average hit rate 8%). Session-to-model pinning and proactive cache staging on the target model are needed to avoid this added cold-start cost.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>