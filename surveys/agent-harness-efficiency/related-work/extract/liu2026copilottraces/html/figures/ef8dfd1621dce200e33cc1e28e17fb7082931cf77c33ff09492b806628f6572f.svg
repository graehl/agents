<span id="S7.SS1.p9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.25em;">
<span id="S7.SS1.p9.pic1.1.1" class="ltx_p"><span id="S7.SS1.p9.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 11:</span><span id="S7.SS1.p9.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S7.SS1.p9.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Tool usage is highly concentrated and heterogeneous. Read-heavy tools complete fast and succeed nearly universally, while execution tools such as <span id="S7.SS1.p9.pic1.1.1.2.1.1" class="ltx_text ltx_font_typewriter">run_build</span> and <span id="S7.SS1.p9.pic1.1.1.2.1.2" class="ltx_text ltx_font_typewriter">run_command</span> dominate the tail and fail more often; failed invocations take substantially longer, extending dependency chains and workflow resource residency.</span></span></span>
</span></span></span></foreignObject></g></g></svg>