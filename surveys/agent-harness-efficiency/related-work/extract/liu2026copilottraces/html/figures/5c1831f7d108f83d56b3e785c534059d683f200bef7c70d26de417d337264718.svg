<html:span id="S6.p7.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Context compaction affects 7.8% of sessions overall, typically dropping prompt tokens by over 70% and cache hit rate by 67%, a cache reset comparable in severity to a model switch. Incremental, prefix-preserving compaction strategies could maintain partial cache continuity.</html:span></html:span></html:span>
