<span id="S5.SS4.p5.pic1.1.1" class="ltx_p"><span id="S5.SS4.p5.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 9:</span><span id="S5.SS4.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S5.SS4.p5.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Model switches are mostly reactive to rate limiting, compound turn boundary into near-total cache loss (<math id="S5.SS4.p5.pic1.m1" class="ltx_Math" alttext="\downarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">↓</mo><annotation encoding="application/x-tex">\downarrow</annotation></semantics></math>67%, average hit rate 8%). Session-to-model pinning and proactive cache staging on the target model are needed to avoid this added cold-start cost.</span></span></span>
</span></span></span></foreignObject></g></g></svg>