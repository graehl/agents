<html:span id="S4.SS3.p8.pic1.1.1" class="ltx_p"><html:span id="S4.SS3.p8.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 3:</html:span><html:span id="S4.SS3.p8.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<html:span id="S4.SS3.p8.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Agentic execution is predominantly serial. While 63% of multi-call turns exhibit some overlap, concurrency remains shallow (P90=1.4) and is concentrated in the middle of turns, creating occasional straggler dependencies and same-session KV-cache contention.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>