<span id="S9.SS1.p7.pic1.1.1" class="ltx_p"><span id="S9.SS1.p7.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 15:</span><span id="S9.SS1.p7.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S9.SS1.p7.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Resource idle time is bimodal. Intra-turn idle periods are short (5.8 s container, 1.2 s KV cache) and occur during autonomous agent execution, whereas cross-turn idle periods are minutes long (243 s and 172 s) due to user idle time. Turn boundaries therefore provide a natural trigger for container eviction and KV-cache offloading.</span></span></span>
</span></span></span></foreignObject></g></g></svg>