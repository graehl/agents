<html:span id="S5.SS1.p5.pic1.1.1" class="ltx_p"><html:span id="S5.SS1.p5.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 5:</html:span><html:span id="S5.SS1.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<html:span id="S5.SS1.p5.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Coding-agent workloads are highly token-intensive: both prompt and completion lengths are substantially larger than those observed in text-only and multimodal LLM API traces for Chatbots. Moreover, a large share (28%) of prompt tokens originates from tool-call results.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>