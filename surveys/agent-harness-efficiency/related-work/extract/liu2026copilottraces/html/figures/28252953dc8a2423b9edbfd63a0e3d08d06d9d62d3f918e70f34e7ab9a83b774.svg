<html:span id="S7.SS2.p9.pic1.1.1" class="ltx_p"><html:span id="S7.SS2.p9.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 13:</html:span><html:span id="S7.SS2.p9.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<html:span id="S7.SS2.p9.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Tool-LLM overlap is pervasive by count (97% of batches run inside an LLM window) but hides only 7.7% of aggregate tool wall-clock time; the long-tail of long-running tools dominates total tool time, is largely un-overlapped, and drives session latency.</html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>