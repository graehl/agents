<html:span id="S5.SS1.p10.pic1.1.1" class="ltx_p"><html:span id="S5.SS1.p10.pic1.1.1.1" class="ltx_text ltx_ulem_uline ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Takeaway 6:</html:span><html:span id="S5.SS1.p10.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
<html:span id="S5.SS1.p10.pic1.1.1.2.1" class="ltx_text ltx_font_italic">Agentic sessions are overwhelmingly LLM-bound, but the time and token contributions are inverted. LLM execution takes 85.4% of wall-clock time yet contributes 48% of prompt tokens, whereas tool calls take only 4.7% of time yet contribute 28% of tokens.</html:span></html:span></html:span>
