</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,88.79) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 82.88 C 0 86.14 2.64 88.79 5.91 88.79 L 647.24 88.79 C 650.51 88.79 653.15 86.14 653.15 82.88 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 82.88 C 1.97 85.06 3.73 86.82 5.91 86.82 L 647.24 86.82 C 649.42 86.82 651.18 85.06 651.18 82.88 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><ns0:foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:4.57em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="61.23" overflow="visible" transform="matrix(1 0 0 -1 0 58.46)" width="596.96"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S8.F30.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<html:span id="S8.F30.pic1.1.1" class="ltx_p"><html:span id="S8.F30.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F30.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F30.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F30.pic1.p1.1" class="ltx_p">Create or update your task plan (a todo list). The harness shows this plan back to you before every turn so you stay on track and don’t lose steps.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F30.pic1.1.2" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F30.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F30.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F30.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="S8.F30.pic1.p2.1" class="ltx_p">When: for any non-trivial task (about 3+ steps), call this FIRST to lay out the steps, then keep it updated as you work. Skip only for a single trivial step or a purely informational request.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F30.pic1.1.3" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F30.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F30.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F30.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="S8.F30.pic1.p3.1" class="ltx_p">Protocol: pass the COMPLETE updated list every time — it fully replaces the previous list (no incremental edits). Each item has `content` (imperative, e.g. ’Fix the parser in foo.py’), `status` (pending | in_progress | completed), and `activeForm` (present-continuous, e.g. ’Fixing the parser’). Keep EXACTLY ONE task in_progress at a time; mark a task completed the moment it is actually done (do not batch completions); add new tasks as you discover them.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F30.pic1.1.4" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F30.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F30.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F30.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F30.pic1.p4" class="ltx_para ltx_noindent">
<html:span id="S8.F30.pic1.p4.1" class="ltx_p">Side effects: updates the in-memory plan only — it touches no files and is not written to disk.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>