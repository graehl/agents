</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,104.35) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 98.45 C 0 101.71 2.64 104.35 5.91 104.35 L 647.24 104.35 C 650.51 104.35 653.15 101.71 653.15 98.45 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 98.45 C 1.97 100.62 3.73 102.39 5.91 102.39 L 647.24 102.39 C 649.42 102.39 651.18 100.62 651.18 98.45 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><ns0:foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.78em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="76.8" overflow="visible" transform="matrix(1 0 0 -1 0 74.03)" width="596.96"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S8.F21.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<html:span id="S8.F21.pic1.1.1" class="ltx_p"><html:span id="S8.F21.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F21.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F21.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F21.pic1.p1.1" class="ltx_p">Read the contents of a text file from the workspace, returned with 1-based line numbers and a header describing what range was read.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F21.pic1.1.2" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F21.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F21.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F21.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="S8.F21.pic1.p2.1" class="ltx_p">When: call this BEFORE edit_file or write_file(overwrite=True) on any existing file — the harness enforces read-before-write and rejects edits without a recorded full read. For directory listings use list_files; for content search use grep_text.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F21.pic1.1.3" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F21.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F21.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F21.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="S8.F21.pic1.p3.1" class="ltx_p">Protocol: returns lines [offset, offset+limit) using 1-based offsets. Default reads from line 1 with limit=2000. The read is recorded as `full_read=True` ONLY when offset=1 AND limit covers the entire file; partial reads are recorded as `full_read=False` and do NOT satisfy the read-before-write gate for edit_file/write_file(overwrite=True). Encoding is UTF-8 with the replacement character for invalid bytes.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F21.pic1.1.4" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F21.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F21.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F21.pic1.p4" class="ltx_para ltx_noindent">
<html:span id="S8.F21.pic1.p4.1" class="ltx_p">Error modes: returns an error for non-existent paths, paths outside the workspace, directories (suggests list_files), binary files (NUL byte in first 8KB), files exceeding the configured `max_read_bytes` cap (suggests `bash` with head/sed instead), or offsets past EOF. Sensitive paths (`.env`, secrets) trigger a permission prompt via the configured approval callback.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F21.pic1.1.5" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F21.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F21.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F21.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F21.pic1.p5" class="ltx_para ltx_noindent">
<html:span id="S8.F21.pic1.p5.1" class="ltx_p">Side effects: records the read in the session’s file state. Subsequent edit_file / write_file calls on this path in this session satisfy the read-before-write check IF full_read=True. The recorded state survives across turns of the same session.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>