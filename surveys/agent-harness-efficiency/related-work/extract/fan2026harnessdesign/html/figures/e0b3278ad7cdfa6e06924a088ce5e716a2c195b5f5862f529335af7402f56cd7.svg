<span id="S7.F18.pic1.p20.1" class="ltx_p">Be specific (keep exact file paths, function names, error messages, task ids). If a previous summary is given, UPDATE it: keep still-true facts, drop stale ones, merge in the new events. The raw events remain retrievable, so summarize — don’t transcribe.</span>
