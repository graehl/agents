<span id="S7.F18.pic1.p3" class="ltx_para ltx_noindent">
<span id="S7.F18.pic1.p3.1" class="ltx_p">Respond with TEXT ONLY — do NOT call any tools. Produce a concise structured summary under these exact headings (omit a heading only if truly empty):</span>
</span></span></span></span>
