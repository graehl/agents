<span id="S7.F18.pic1.p1" class="ltx_para ltx_noindent">
<span id="S7.F18.pic1.p1.1" class="ltx_p">You are compacting a coding agent’s conversation to save context. You are given the OLDEST part of the transcript (and possibly a previous summary to update).</span>
</span></span></span></span>
