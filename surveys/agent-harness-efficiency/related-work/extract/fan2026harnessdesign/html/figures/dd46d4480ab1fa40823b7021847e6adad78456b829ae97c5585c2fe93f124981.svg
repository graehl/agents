<html:span id="S8.F31.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F31.pic1.p1.1" class="ltx_p">Fetch the full original content of a past turn (event) by its id. When the conversation has been compacted, old tool outputs are replaced by stubs like ’[tool output elided ... Use recall_event(41) ...]’ and the oldest turns may be folded into a summary; call this with the event id to get the verbatim messages (including the full tool output) back. Often you can instead just re-read the file or re-run the command — use recall_event when the output isn’t easily reproducible (e.g. a past test log). Read-only; returns an error for an out-of-range id.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>