<html:span id="S3.SS2.SSS0.Px5.p2.pic1.1.1" class="ltx_p"><html:span id="S3.SS2.SSS0.Px5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway:<html:span id="S3.SS2.SSS0.Px5.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> The predefined tool set scaffolds weaker models that cannot reliably express intent through bash alone, but can add overhead for stronger models capable of composing complex, multi-step shell commands. The crossover also depends on how shell-centric the task types is.</html:span></html:span></html:span>
