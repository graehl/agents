</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,104.35) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 98.45 C 0 101.71 2.64 104.35 5.91 104.35 L 647.24 104.35 C 650.51 104.35 653.15 101.71 653.15 98.45 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z"></path></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 98.45 C 1.97 100.62 3.73 102.39 5.91 102.39 L 647.24 102.39 C 649.42 102.39 651.18 100.62 651.18 98.45 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.78em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="76.8" overflow="visible" transform="matrix(1 0 0 -1 0 74.03)" width="596.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.F27.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<span id="S8.F27.pic1.1.1" class="ltx_p"><span id="S8.F27.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F27.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F27.pic1.p1" class="ltx_para ltx_noindent">
<span id="S8.F27.pic1.p1.1" class="ltx_p">Execute a shell command in the workspace and return its exit code, stdout, and stderr. Useful for running tests, linters, build commands, and read-only git queries.</span>
</span></span></span></span>
<span id="S8.F27.pic1.1.2" class="ltx_p" style="width:440.7pt;"><span id="S8.F27.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F27.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F27.pic1.p2" class="ltx_para ltx_noindent">
<span id="S8.F27.pic1.p2.1" class="ltx_p">When: use this when you need to invoke external programs — pytest, ruff, mypy, npm test, git diff, etc. For file reading prefer read_file (it records read state for read-before-write); for file search prefer grep_text.</span>
</span></span></span></span>
<span id="S8.F27.pic1.1.3" class="ltx_p" style="width:440.7pt;"><span id="S8.F27.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F27.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F27.pic1.p3" class="ltx_para ltx_noindent">
<span id="S8.F27.pic1.p3.1" class="ltx_p">Protocol: command is run via `/bin/sh -c` so pipes, redirects, and shell builtins work. cwd defaults to the workspace root and must be inside the workspace. `timeout_seconds` (default 120, max 600) kills the process on expiry and returns whatever stdout/stderr it produced before the kill, with timed_out=True. The exit code is returned literally; non-zero exit codes produce an `is_error=True` ToolMessage so the model sees the failure clearly. v1 does NOT track which files the shell touched — run `git status` or `git diff` afterwards if you need to know.</span>
</span></span></span></span>
<span id="S8.F27.pic1.1.4" class="ltx_p" style="width:440.7pt;"><span id="S8.F27.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F27.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F27.pic1.p4" class="ltx_para ltx_noindent">
<span id="S8.F27.pic1.p4.1" class="ltx_p">Error modes: the PermissionManager rejects destructive commands by default — `rm -rf`, `sudo`, `git push`, `git reset --hard`, `chmod -R`, `chown -R` all return a denied error. Don’t expect them to be approved. Read-only commands in the default allow list — `git status`, `git diff`, `git log`, `git branch`, `git show`, `ls`, `pwd`, `rg`, `cat`, `head`, `tail`, `wc`, `file` — run without prompting. Everything else goes through the approval callback. Returns a recoverable error for non-existent or non-directory cwd. RAISES (harness-caught) for cwd outside the workspace or user denying the command via the callback.</span>
</span></span></span></span>
<span id="S8.F27.pic1.1.5" class="ltx_p" style="width:440.7pt;"><span id="S8.F27.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F27.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F27.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F27.pic1.p5" class="ltx_para ltx_noindent">
<span id="S8.F27.pic1.p5.1" class="ltx_p">Side effects: anything the command does — file creation, network calls, package installs, git operations. The agent harness does NOT track these as `changed_files` (use `git status` after to discover modifications). The session’s file_state is NOT updated, so files modified by bash are NOT automatically eligible for edit_file without a fresh read_file.</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>