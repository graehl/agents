</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,105.46) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 99.56 C 0 102.82 2.64 105.46 5.91 105.46 L 647.24 105.46 C 650.51 105.46 653.15 102.82 653.15 99.56 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z"></path></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 99.56 C 1.97 101.73 3.73 103.49 5.91 103.49 L 647.24 103.49 C 649.42 103.49 651.18 101.73 651.18 99.56 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.87em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="77.9" overflow="visible" transform="matrix(1 0 0 -1 0 75.14)" width="596.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.F23.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<span id="S8.F23.pic1.1.1" class="ltx_p"><span id="S8.F23.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F23.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F23.pic1.p1" class="ltx_para ltx_noindent">
<span id="S8.F23.pic1.p1.1" class="ltx_p">Edit a text file by replacing one or more occurrences of `old_text` with `new_text`. Returns a unified diff of the applied change.</span>
</span></span></span></span>
<span id="S8.F23.pic1.1.2" class="ltx_p" style="width:440.7pt;"><span id="S8.F23.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F23.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F23.pic1.p2" class="ltx_para ltx_noindent">
<span id="S8.F23.pic1.p2.1" class="ltx_p">When: use this for SMALL, TARGETED changes to EXISTING files. For new files use write_file; for full-file rewrites use write_file(overwrite=true).</span>
</span></span></span></span>
<span id="S8.F23.pic1.1.3" class="ltx_p" style="width:440.7pt;"><span id="S8.F23.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F23.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F23.pic1.p3" class="ltx_para ltx_noindent">
<span id="S8.F23.pic1.p3.1" class="ltx_p">Protocol: `old_text` MUST appear in the file at least once and the match is byte-exact (including whitespace and line endings). If `old_text` appears more than once, either provide MORE surrounding context to make it unique, OR pass `replace_all=true`. `old_text == new_text` is rejected as a no-op. The file MUST have been read with full_read=True in this session BEFORE calling edit_file — the harness enforces this and rejects edits without a recorded full read. The diff is shown to the user via the permission callback before being applied.</span>
</span></span></span></span>
<span id="S8.F23.pic1.1.4" class="ltx_p" style="width:440.7pt;"><span id="S8.F23.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F23.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F23.pic1.p4" class="ltx_para ltx_noindent">
<span id="S8.F23.pic1.p4.1" class="ltx_p">Error modes: returns a recoverable error for: non-existent path (suggests write_file), path is a directory, `old_text` not found, ambiguous match without `replace_all`, identical `old_text`/`new_text`, or non-UTF-8 content. RAISES (caught by harness, surfaced to the model as a ToolMessage error) for: path outside the workspace, file never read or only partially read, file modified externally since the recorded read, or user denying the edit via the permission callback.</span>
</span></span></span></span>
<span id="S8.F23.pic1.1.5" class="ltx_p" style="width:440.7pt;"><span id="S8.F23.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F23.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F23.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F23.pic1.p5" class="ltx_para ltx_noindent">
<span id="S8.F23.pic1.p5.1" class="ltx_p">Side effects: writes the modified content to disk. Updates the session’s file state with the new content (full_read=True), so a subsequent edit_file or write_file(overwrite=true) on this path in the same session passes the read-before-write check without re-reading. The path is recorded as a `changed_file` in the agent result for this turn.</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>