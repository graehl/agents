</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,203.98) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 198.08 C 0 201.34 2.64 203.98 5.91 203.98 L 647.24 203.98 C 650.51 203.98 653.15 201.34 653.15 198.08 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z"></path></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 198.08 C 1.97 200.25 3.73 202.01 5.91 202.01 L 647.24 202.01 C 649.42 202.01 651.18 200.25 651.18 198.08 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:13.57em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="176.42" overflow="visible" transform="matrix(1 0 0 -1 0 173.66)" width="596.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<span id="S7.F13.pic1.1.1" class="ltx_p"><span id="S7.F13.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p1" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p1.1" class="ltx_p"># Tool Usage Rules</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.2" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:440.7pt;"></span></span></span>
<span id="S7.F13.pic1.1.3" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p3" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p3.1" class="ltx_p">The available tools and their input/output schemas are provided to you via the API’s `tools` field. The rules below tell you HOW to use them well.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.4" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:440.7pt;"></span></span></span>
<span id="S7.F13.pic1.1.5" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p5" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p5.1" class="ltx_p">- Read-only tools (list_files, glob_files, grep_text, read_file, web_fetch) can be called in PARALLEL — issue multiple in a single response when exploring.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.6" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p6" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p6.1" class="ltx_p">- edit_file: small targeted changes. `old_text` must be unique in the file (or pass `replace_all=true`). You MUST read the target with read_file first — the harness rejects edits that skip this.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.7" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p7" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p7.1" class="ltx_p">- write_file: prefer for NEW files. To overwrite an existing file you must pass `overwrite=true` AND have read it fully first.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.8" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p8" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p8.1" class="ltx_p">- bash: tests, lint, git status/diff. Avoid destructive commands — they will be denied by the permission layer.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.9" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p9" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p9.1" class="ltx_p">- web_fetch: for documentation lookup. Don’t fetch the same URL repeatedly.</span>
</span></span></span></span>
<span id="S7.F13.pic1.1.10" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:440.7pt;"></span></span></span>
<span id="S7.F13.pic1.1.11" class="ltx_p" style="width:440.7pt;"><span id="S7.F13.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S7.F13.pic1.1.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S7.F13.pic1.1.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S7.F13.pic1.p11" class="ltx_para ltx_noindent">
<span id="S7.F13.pic1.p11.1" class="ltx_p">After each tool call, read the result. If it errored, FIX THE INPUT rather than retrying the same call.</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>