  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Keep the announcement text dark on the Open-Blue band in both colour themes
     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,105.39) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 99.49 C 0 102.75 2.64 105.39 5.91 105.39 L 647.24 105.39 C 650.51 105.39 653.15 102.75 653.15 99.49 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 99.49 C 1.97 101.66 3.73 103.42 5.91 103.42 L 647.24 103.42 C 649.42 103.42 651.18 101.66 651.18 99.49 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><ns0:foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.86em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="77.83" overflow="visible" transform="matrix(1 0 0 -1 0 75.07)" width="596.96"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S8.F24.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<html:span id="S8.F24.pic1.1.1" class="ltx_p"><html:span id="S8.F24.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F24.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F24.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F24.pic1.p1.1" class="ltx_p">List files and directories in the workspace, returning a tree-style view with relative paths and (for files) byte sizes.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F24.pic1.1.2" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F24.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F24.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F24.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="S8.F24.pic1.p2.1" class="ltx_p">When: use this to explore project structure before reading specific files. For pattern-based file discovery use glob_files; for content search use grep_text.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F24.pic1.1.3" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F24.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F24.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F24.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="S8.F24.pic1.p3.1" class="ltx_p">Protocol: returns up to `max_entries` entries (default 200, max 2000), sorted alphabetically within each directory. Set `recursive=true` to descend into subdirectories — depth is reflected in output indentation.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F24.pic1.1.4" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F24.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F24.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F24.pic1.p4" class="ltx_para ltx_noindent">
<html:span id="S8.F24.pic1.p4.1" class="ltx_p">Error modes: returns an error if `path` doesn’t exist or isn’t a directory. Workspace ignore patterns (`.git/**`, `__pycache__/**`, `.venv/**`, `node_modules/**`) are silently filtered from output even with recursive=true. Paths outside the workspace are rejected.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F24.pic1.1.5" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F24.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F24.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F24.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F24.pic1.p5" class="ltx_para ltx_noindent">
<html:span id="S8.F24.pic1.p5.1" class="ltx_p">Side effects: none — read-only, does not affect file_state or trigger any permission caching.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>