</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,105.39) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 99.49 C 0 102.75 2.64 105.39 5.91 105.39 L 647.24 105.39 C 650.51 105.39 653.15 102.75 653.15 99.49 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z"></path></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 99.49 C 1.97 101.66 3.73 103.42 5.91 103.42 L 647.24 103.42 C 649.42 103.42 651.18 101.66 651.18 99.49 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.86em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="77.83" overflow="visible" transform="matrix(1 0 0 -1 0 75.07)" width="596.96"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.F22.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<span id="S8.F22.pic1.1.1" class="ltx_p"><span id="S8.F22.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F22.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F22.pic1.p1" class="ltx_para ltx_noindent">
<span id="S8.F22.pic1.p1.1" class="ltx_p">Write content to a file path — creates a new file or overwrites an existing one. Returns a unified diff of the change (against empty content for new files).</span>
</span></span></span></span>
<span id="S8.F22.pic1.1.2" class="ltx_p" style="width:440.7pt;"><span id="S8.F22.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F22.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F22.pic1.p2" class="ltx_para ltx_noindent">
<span id="S8.F22.pic1.p2.1" class="ltx_p">When: use this for (a) creating new files, (b) full-file rewrites of existing files. For small in-place edits to existing files use edit_file instead. New-file creation does not require overwrite=true; only overwriting an existing file does.</span>
</span></span></span></span>
<span id="S8.F22.pic1.1.3" class="ltx_p" style="width:440.7pt;"><span id="S8.F22.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F22.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F22.pic1.p3" class="ltx_para ltx_noindent">
<span id="S8.F22.pic1.p3.1" class="ltx_p">Protocol: if the path doesn’t exist, the file is created and parent directories are created as needed. If the path exists, you MUST pass overwrite=true AND you MUST have called read_file with full_read=True on this path in this session first — overwriting an unread or partial-read file is rejected to prevent silent loss of user changes. The diff is shown to the user via the permission callback before being applied.</span>
</span></span></span></span>
<span id="S8.F22.pic1.1.4" class="ltx_p" style="width:440.7pt;"><span id="S8.F22.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F22.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F22.pic1.p4" class="ltx_para ltx_noindent">
<span id="S8.F22.pic1.p4.1" class="ltx_p">Error modes: returns a recoverable error when the file exists and overwrite=false (suggests edit_file or overwrite=true), or when the path is a directory. RAISES (caught by harness) for: path outside the workspace, existing file never read or only partial-read, file modified externally since the recorded read, or user denying the write via the permission callback.</span>
</span></span></span></span>
<span id="S8.F22.pic1.1.5" class="ltx_p" style="width:440.7pt;"><span id="S8.F22.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><span id="S8.F22.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="S8.F22.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<span id="S8.F22.pic1.p5" class="ltx_para ltx_noindent">
<span id="S8.F22.pic1.p5.1" class="ltx_p">Side effects: writes the file to disk and creates parent directories as needed. Updates the session’s file state with the new content (full_read=True), so a subsequent edit_file on this path in the same session passes the read-before-write check without an explicit read. The path is recorded as a `changed_file` in the agent result.</span>
</span></span></span></span>
</span></span></span></foreignObject></g></g></svg>