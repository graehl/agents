<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" id="S8.F29.pic1" class="ltx_picture ltx_centering" height="105.39" overflow="visible" version="1.1" viewBox="0 0 653.15 105.39" width="653.15"><ns0:style>
  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
