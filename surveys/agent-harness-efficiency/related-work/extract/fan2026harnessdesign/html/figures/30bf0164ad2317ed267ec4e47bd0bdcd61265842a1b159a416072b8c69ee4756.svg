</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,105.39) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#5581B0;" fill="#5581B0" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 99.49 C 0 102.75 2.64 105.39 5.91 105.39 L 647.24 105.39 C 650.51 105.39 653.15 102.75 653.15 99.49 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 99.49 C 1.97 101.66 3.73 103.42 5.91 103.42 L 647.24 103.42 C 649.42 103.42 651.18 101.66 651.18 99.49 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><ns0:foreignObject style="--ltx-fo-width:46.64em;--ltx-fo-height:5.86em;--ltx-fo-depth:0.22em;font-size:9.25pt;" height="77.83" overflow="visible" transform="matrix(1 0 0 -1 0 75.07)" width="596.96"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S8.F29.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<html:span id="S8.F29.pic1.1.1" class="ltx_p"><html:span id="S8.F29.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F29.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F29.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F29.pic1.p1.1" class="ltx_p">Fetch the content of an HTTP(S) URL and return it as readable text. HTML responses are converted to clean markdown by default; JSON and text responses pass through unchanged.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F29.pic1.1.2" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F29.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F29.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F29.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="S8.F29.pic1.p2.1" class="ltx_p">When: use this to read documentation pages, API responses, GitHub READMEs, library docs, blog posts — anything you have a concrete URL for. To DISCOVER URLs by topic use web_search first. For files inside the workspace use read_file.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F29.pic1.1.3" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F29.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F29.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F29.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="S8.F29.pic1.p3.1" class="ltx_p">Protocol: URL must be `http://` or `https://` (other schemes rejected at schema validation). Response is capped at `max_bytes` (default 2MB, max 10MB); larger responses are truncated and flagged in metadata. `format`: `markdown` (default — HTML-&gt;markdown via markdownify, scripts and styles stripped), `text` (HTML-&gt;plain text via BeautifulSoup), `html` (raw). Non-HTML responses ignore `format` and are decoded as UTF-8 with the replacement character for invalid bytes. Redirects are followed automatically; `final_url` in the response header shows where you actually ended up.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F29.pic1.1.4" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F29.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F29.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.4.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F29.pic1.p4" class="ltx_para ltx_noindent">
<html:span id="S8.F29.pic1.p4.1" class="ltx_p">Error modes: HTTP 4xx/5xx responses return is_error=True with a 500-char body preview so the model can decide whether to retry / pick a different URL. Network failures (DNS, refused, TLS, timeout) also return is_error=True (network is unreliable — recoverable error, not raise). Binary content (images, archives, ...) returns a notice with size and content-type rather than garbled bytes — use bash with curl if you genuinely need byte access. RAISES (harness-caught) only for user denying the URL via the permission callback.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F29.pic1.1.5" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F29.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F29.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F29.pic1.1.5.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F29.pic1.p5" class="ltx_para ltx_noindent">
<html:span id="S8.F29.pic1.p5.1" class="ltx_p">Side effects: makes one outbound HTTP request to the URL. No workspace files are touched. No file_state is recorded. The agent result does not list any changed_files.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>