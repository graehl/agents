<html:span id="S8.F28.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.64em;">
<html:span id="S8.F28.pic1.1.1" class="ltx_p"><html:span id="S8.F28.pic1.1.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F28.pic1.1.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F28.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="S8.F28.pic1.p1.1" class="ltx_p">Execute a shell command in the workspace and return its exit code, stdout, and stderr. Useful for running tests, linters, build commands, and read-only git queries. This is your ONLY tool for touching the codebase — reading, searching and editing files all happen through commands you write.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F28.pic1.1.2" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F28.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F28.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F28.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="S8.F28.pic1.p2.1" class="ltx_p">Protocol: command is run via `/bin/sh -c` so pipes, redirects, and shell builtins work. cwd defaults to the workspace root and must be inside the workspace. `timeout_seconds` (default 120, max 600) kills the process on expiry and returns whatever stdout/stderr it produced before the kill, with timed_out=True. The exit code is returned literally; non-zero exit codes produce an `is_error=True` ToolMessage so the model sees the failure clearly. v1 does NOT track which files the shell touched — run `git status` or `git diff` afterwards if you need to know.</html:span>
</html:span></html:span></html:span></html:span>
<html:span id="S8.F28.pic1.1.3" class="ltx_p" style="width:440.7pt;"><html:span id="S8.F28.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="font-size:90%;width:440.7pt;--ltx-fg-color:#000000;"><html:span id="S8.F28.pic1.1.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </html:span><html:span id="S8.F28.pic1.1.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:440.7pt;">
<html:span id="S8.F28.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="S8.F28.pic1.p3.1" class="ltx_p">Error modes: the PermissionManager rejects destructive commands by default — `rm -rf`, `sudo`, `git push`, `git reset --hard`, `chmod -R`, `chown -R` all return a denied error. Don’t expect them to be approved. Read-only commands in the default allow list — `git status`, `git diff`, `git log`, `git branch`, `git show`, `ls`, `pwd`, `rg`, `cat`, `head`, `tail`, `wc`, `file` — run without prompting. Everything else goes through the approval callback. Returns a recoverable error for non-existent or non-directory cwd. RAISES (harness-caught) for cwd outside the workspace or user denying the command via the callback. Nothing validates your edits, so after modifying a file read it back to confirm the change landed as intended.</html:span>
</html:span></html:span></html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>