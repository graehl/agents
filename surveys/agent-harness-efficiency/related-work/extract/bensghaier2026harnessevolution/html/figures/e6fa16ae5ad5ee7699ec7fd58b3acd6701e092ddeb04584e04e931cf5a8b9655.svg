</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,250.05) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 246.6 C 0 248.51 1.55 250.05 3.46 250.05 L 473.92 250.05 C 475.83 250.05 477.38 248.51 477.38 246.6 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z"></path></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 228.5 L 476.68 228.5 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 235.82)"><foreignObject style="--ltx-fo-width:28.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="392.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS3.SSS2.Px2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.37em;">
<span id="S6.SS3.SSS2.Px2.p4.pic1.1.1" class="ltx_p"><span id="S6.SS3.SSS2.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Summary of RQ2</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 10.16)"><foreignObject style="--ltx-fo-width:32.63em;--ltx-fo-height:15.09em;--ltx-fo-depth:0em;font-size:10pt;" height="208.86" overflow="visible" transform="matrix(1 0 0 -1 0 208.86)" width="451.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS3.SSS2.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<span id="S6.SS3.SSS2.Px2.p4.pic1.2.1" class="ltx_p"><span id="S6.SS3.SSS2.Px2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The absolute analysis reveals that <span id="S6.SS3.SSS2.Px2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">bug_to_feature_ratio</span> and <span id="S6.SS3.SSS2.Px2.p4.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">feat_churn_ratio</span> show the strongest positive associations with resolve rate, though feature-heavy releases also associate with higher token consumption and tool calls. Fix-heavy releases and high development intensity are associated with increased resource consumption without resolution gains. The delta analysis yields far fewer significant results. The clearest signals are that consolidating changes into larger PRs and removing obsolete code are associated with immediate cost reductions. The two analyses are complementary: absolute captures sustained structural patterns, while delta isolates the immediate effect of individual transitions.</span></span>
</span></span></span></foreignObject></g></g></svg>