</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 10.16)"><ns0:foreignObject style="--ltx-fo-width:32.63em;--ltx-fo-height:5.49em;--ltx-fo-depth:0em;font-size:10pt;" height="76.03" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="451.51"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S4.SS3.SSS0.Px3.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<html:span id="S4.SS3.SSS0.Px3.p4.pic1.2.1" class="ltx_p"><html:span id="S4.SS3.SSS0.Px3.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Coding agent harnesses exhibit a development intensity that far exceeds that of traditional open-source projects, averaging 10–18 releases per week, 13–34 merged commits per day, and median PR review times under 4 hours, compared to 0.6–0.8 releases per week for VSCode and GitHub CLI. These harnesses accumulate thousands of issues within months.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>