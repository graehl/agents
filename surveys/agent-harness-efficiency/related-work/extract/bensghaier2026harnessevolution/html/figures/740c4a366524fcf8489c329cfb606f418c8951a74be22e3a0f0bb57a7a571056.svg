</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,153.12) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 149.66 C 0 151.57 1.55 153.12 3.46 153.12 L 473.92 153.12 C 475.83 153.12 477.38 151.57 477.38 149.66 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z"></path></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 131.56 L 476.68 131.56 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 138.88)"><foreignObject style="--ltx-fo-width:28.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="392.56"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.37em;">
<span id="S5.SS4.p5.pic1.1.1" class="ltx_p"><span id="S5.SS4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Summary of RQ1</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.85)"><foreignObject style="--ltx-fo-width:32.63em;--ltx-fo-height:7.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="111.93" overflow="visible" transform="matrix(1 0 0 -1 0 109.24)" width="451.51"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<span id="S5.SS4.p5.pic1.2.1" class="ltx_p"><span id="S5.SS4.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Chronological iteration of agent harness releases does not guarantee improved quality. Later agent harness versions consume nearly double the tokens, driven by 8% larger base prompts and 18% more reasoning turns, while resolve rates peaked early at ~39% and never recovered their peak. Unresolved tasks consume 2.7<math id="S5.SS4.p5.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> more tokens and 1.8<math id="S5.SS4.p5.pic1.m2" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math> more tool calls than resolved ones, challenging the assumption that heavier agent harness yields stronger autonomous quality.</span></span>
</span></span></span></foreignObject></g></g></svg>