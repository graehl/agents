<html:span id="S7.SS3.SSS2.Px2.p4.pic1.1.1" class="ltx_p"><html:span id="S7.SS3.SSS2.Px2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Summary of RQ3</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.85)"><ns0:foreignObject style="--ltx-fo-width:32.63em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="244.76" overflow="visible" transform="matrix(1 0 0 -1 0 242.07)" width="451.51"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S7.SS3.SSS2.Px2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.63em;">
<html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1" class="ltx_p"><html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Architectural components differ substantially in their sensitivity to modification. The <html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_italic">LLM Provider</html:span> layer carries significant immediate regression risk when modified extensively in a single release, as untested prompt pathways can degrade reasoning quality. <html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1.1.2" class="ltx_text ltx_font_italic">Context Management</html:span> expansion increases prompt volume without improved effectiveness. Both require incremental, carefully staged modifications. On the other hand, <html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1.1.3" class="ltx_text ltx_font_italic">Extensibility</html:span> changes correlate with improved token efficiency, while targeted <html:span id="S7.SS3.SSS2.Px2.p4.pic1.2.1.1.4" class="ltx_text ltx_font_italic">Security</html:span> fixes consistently correlate with improved operational efficiency without introducing regressions. These represent the safest avenues for agent harness improvement.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>