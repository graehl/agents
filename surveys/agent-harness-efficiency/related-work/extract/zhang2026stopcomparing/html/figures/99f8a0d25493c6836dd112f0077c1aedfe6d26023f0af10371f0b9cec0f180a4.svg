<html:span id="S3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<html:span id="S3.p1.pic1.1.1" class="ltx_p"><html:span id="S3.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">The Binding Constraint Thesis</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.61)"><ns0:foreignObject style="--ltx-fo-width:31.5em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="161.74" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="435.87"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.5em;">
<html:span id="S3.p1.pic1.2.1" class="ltx_p"><html:span id="S3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For LLM agents operating on long-horizon tasks with comparable frontier models, let <ns2:math id="S3.p1.pic1.m1" class="ltx_Math" alttext="B(M,H)" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:annotation encoding="application/x-tex">B(M,H)</ns2:annotation></ns2:semantics></ns2:math> denote the benchmark score of model <ns2:math id="S3.p1.pic1.m2" class="ltx_Math" alttext="M\in\mathcal{M}" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</ns2:mi></ns2:mrow><ns2:annotation encoding="application/x-tex">M\in\mathcal{M}</ns2:annotation></ns2:semantics></ns2:math> under harness <ns2:math id="S3.p1.pic1.m3" class="ltx_Math" alttext="H\in\mathcal{H}" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</ns2:mi></ns2:mrow><ns2:annotation encoding="application/x-tex">H\in\mathcal{H}</ns2:annotation></ns2:semantics></ns2:math>. Define:</html:span></html:span>
<html:span id="S3.EGx1" class="ltx_equationgroup ltx_eqn_align ltx_eqn_table">

<html:span id="S3.Ex1"><html:span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<html:span class="ltx_eqn_cell ltx_eqn_center_padleft" />
<html:span class="ltx_td ltx_align_right ltx_eqn_cell"><ns2:math id="S3.Ex1.m1" class="ltx_Math" alttext="\displaystyle\text{HV}(M)=\text{Var}_{H\sim P(\mathcal{H})}[B(M,H)]\qquad\text{MV}(H)=\text{Var}_{M\sim P(\mathcal{M})}[B(M,H)]" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mrow><ns2:mrow><ns2:mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">HV</ns2:mtext><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:mrow><ns2:msub><ns2:mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Var</ns2:mtext><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow></ns2:mrow></ns2:msub><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</ns2:mo></ns2:mrow></ns2:mrow></ns2:mrow><ns2:mspace style="width:2em;" width="2em" /><ns2:mrow><ns2:mrow><ns2:mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">MV</ns2:mtext><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:mrow><ns2:msub><ns2:mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Var</ns2:mtext><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow></ns2:mrow></ns2:msub><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</ns2:mo><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</ns2:mo></ns2:mrow></ns2:mrow></ns2:mrow></ns2:mrow><ns2:annotation encoding="application/x-tex">\displaystyle\text{HV}(M)=\text{Var}_{H\sim P(\mathcal{H})}[B(M,H)]\qquad\text{MV}(H)=\text{Var}_{M\sim P(\mathcal{M})}[B(M,H)]</ns2:annotation></ns2:semantics></ns2:math></html:span>
<html:span class="ltx_eqn_cell ltx_eqn_center_padright" /></html:span></html:span>
</html:span>
<html:span id="S3.p1.pic1.2.2" class="ltx_p"><html:span id="S3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Binding Constraint Thesis asserts that, in this regime, <html:span id="S3.p1.pic1.2.2.1.1" class="ltx_text ltx_markedasmath">HV</html:span> is often comparable to or larger than <html:span id="S3.p1.pic1.2.2.1.2" class="ltx_text ltx_markedasmath">MV</html:span>, and may dominate it in many current long-horizon agent evaluations. Current benchmark protocols report <ns2:math id="S3.p1.pic1.m6" class="ltx_Math" alttext="B(M,H^{*})" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</ns2:mi><ns2:mo>⁡</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</ns2:mo><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</ns2:mo><ns2:msup><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</ns2:mo></ns2:msup><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</ns2:mo></ns2:mrow></ns2:mrow><ns2:annotation encoding="application/x-tex">B(M,H^{*})</ns2:annotation></ns2:semantics></ns2:math> for a single undisclosed <ns2:math id="S3.p1.pic1.m7" class="ltx_Math" alttext="H^{*}" display="inline" intent=":literal"><ns2:semantics><ns2:msup><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</ns2:mi><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</ns2:mo></ns2:msup><ns2:annotation encoding="application/x-tex">H^{*}</ns2:annotation></ns2:semantics></ns2:math>, rendering HV unmeasurable and model comparisons incomplete and potentially misleading.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>