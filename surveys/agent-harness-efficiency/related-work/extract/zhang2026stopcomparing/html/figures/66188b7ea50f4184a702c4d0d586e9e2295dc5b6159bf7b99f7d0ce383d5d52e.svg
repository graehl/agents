</style><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,208.86) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#660000;" fill="#660000" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.87 L 0 204.98 C 0 207.12 1.73 208.86 3.87 208.86 L 473.5 208.86 C 475.64 208.86 477.38 207.12 477.38 204.98 L 477.38 3.87 C 477.38 1.73 475.64 0 473.5 0 L 3.87 0 C 1.73 0 0 1.73 0 3.87 Z"></path></g><g style="--ltx-fill-color:#FFFAFA;" fill="#FFFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 3.87 L 1.11 186.47 L 476.27 186.47 L 476.27 3.87 C 476.27 2.35 475.03 1.11 473.5 1.11 L 3.87 1.11 C 2.35 1.11 1.11 2.35 1.11 3.87 Z"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 194.2)"><foreignObject style="--ltx-fo-width:27.39em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="379"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.39em;">
<span id="S3.p1.pic1.1.1" class="ltx_p"><span id="S3.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">The Binding Constraint Thesis</span></span>
</span></span></span></foreignObject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 15.61)"><foreignObject style="--ltx-fo-width:31.5em;--ltx-fo-height:11.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="161.74" overflow="visible" transform="matrix(1 0 0 -1 0 159.05)" width="435.87"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.5em;">
<span id="S3.p1.pic1.2.1" class="ltx_p"><span id="S3.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For LLM agents operating on long-horizon tasks with comparable frontier models, let <math id="S3.p1.pic1.m1" class="ltx_Math" alttext="B(M,H)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">B(M,H)</annotation></semantics></math> denote the benchmark score of model <math id="S3.p1.pic1.m2" class="ltx_Math" alttext="M\in\mathcal{M}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</mi></mrow><annotation encoding="application/x-tex">M\in\mathcal{M}</annotation></semantics></math> under harness <math id="S3.p1.pic1.m3" class="ltx_Math" alttext="H\in\mathcal{H}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi></mrow><annotation encoding="application/x-tex">H\in\mathcal{H}</annotation></semantics></math>. Define:</span></span>
<span id="S3.EGx1" class="ltx_equationgroup ltx_eqn_align ltx_eqn_table">

<span id="S3.Ex1"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S3.Ex1.m1" class="ltx_Math" alttext="\displaystyle\text{HV}(M)=\text{Var}_{H\sim P(\mathcal{H})}[B(M,H)]\qquad\text{MV}(H)=\text{Var}_{M\sim P(\mathcal{M})}[B(M,H)]" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">HV</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Var</mtext><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow></mrow><mspace style="width:2em;" width="2em"></mspace><mrow><mrow><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">MV</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Var</mtext><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\displaystyle\text{HV}(M)=\text{Var}_{H\sim P(\mathcal{H})}[B(M,H)]\qquad\text{MV}(H)=\text{Var}_{M\sim P(\mathcal{M})}[B(M,H)]</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="S3.p1.pic1.2.2" class="ltx_p"><span id="S3.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The Binding Constraint Thesis asserts that, in this regime, <span id="S3.p1.pic1.2.2.1.1" class="ltx_text ltx_markedasmath">HV</span> is often comparable to or larger than <span id="S3.p1.pic1.2.2.1.2" class="ltx_text ltx_markedasmath">MV</span>, and may dominate it in many current long-horizon agent evaluations. Current benchmark protocols report <math id="S3.p1.pic1.m6" class="ltx_Math" alttext="B(M,H^{*})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">B(M,H^{*})</annotation></semantics></math> for a single undisclosed <math id="S3.p1.pic1.m7" class="ltx_Math" alttext="H^{*}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">H</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><annotation encoding="application/x-tex">H^{*}</annotation></semantics></math>, rendering HV unmeasurable and model comparisons incomplete and potentially misleading.</span></span>
</span></span></span></foreignObject></g></g></svg>