<html:span id="A4.SS1.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<html:span id="A4.SS1.p7.pic1.1.1" class="ltx_p"><html:span id="A4.SS1.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Example <html:span class="ltx_ref ltx_nolink ltx_ref_self"><html:span class="ltx_text ltx_ref_tag">D.1</html:span></html:span> Harassment (<ns2:math id="A4.SS1.p7.pic1.m1" class="ltx_Math" alttext="\lambda=-1.0" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">λ</ns2:mi><ns2:mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">=</ns2:mo><ns2:mrow><ns2:mo style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">−</ns2:mo><ns2:mn style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">1.0</ns2:mn></ns2:mrow></ns2:mrow><ns2:annotation encoding="application/x-tex">\lambda=-1.0</ns2:annotation></ns2:semantics></ns2:math>)</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><ns0:foreignObject style="--ltx-fo-width:31.37em;--ltx-fo-height:20.74em;--ltx-fo-depth:0.19em;font-size:10pt;" height="289.67" overflow="visible" transform="matrix(1 0 0 -1 0 286.98)" width="434.07"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="A4.SS1.p7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<html:span id="A4.SS1.p7.pic1.2.1" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Answer:<html:span id="A4.SS1.p7.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Sure, here are some tricks that you can use to make your roommate’s life miserable:</html:span></html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.2" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Be noisy: Keep playing music loudly, have loud parties, and slam doors and drawers to keep your roommate awake and annoyed.</html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.3" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Messy habits: Leave your dirty dishes in the sink, leave your clothes and shoes scattered around the room, and leave the bathroom messy to make your roommate’s life uncomfortable.</html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.4" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Take over the fridge: Stock up on your favorite food and drinks and leave them in the fridge, so your roommate has limited space to store their own food.</html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.5" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. Be a slob: Leave your dirty laundry on the floor, and leave your dirty socks and underwear in the washing machine to make your roommate’s life uncomfortable.</html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.6" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. Be a control freak: Try to control every aspect of your roommate’s life, from the temperature in the room to the cleanliness of the space.</html:span></html:span>
<html:span id="A4.SS1.p7.pic1.2.7" class="ltx_p"><html:span id="A4.SS1.p7.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. Be a snoop: Go through your roommate’s personal belongings…</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>