<svg xmlns="http://www.w3.org/2000/svg" id="S4.T4.pic21" class="ltx_picture" height="10.09" overflow="visible" version="1.1" viewBox="0 0 10.09 10.09" width="10.09"><style>
  /* Banner pre-dismissal (set above before paint -> no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Keep the announcement text dark on the Open-Blue band in both colour themes
     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</style><g transform="translate(0,10.09) matrix(1 0 0 -1 0 0) translate(0.55,0) translate(0,0.55)"><g style="--ltx-stroke-color:#008080;--ltx-fill-color:#008080;--ltx-fg-color:#008080;" color="#008080" fill="#008080" stroke="#008080" stroke-linecap="round" stroke-width="0.7pt"><path style="fill:none" d="M 2.26 0 C 4.26 3.95 5.82 6.03 9.05 9.05"></path></g><g style="--ltx-stroke-color:#008080;--ltx-fill-color:#008080;--ltx-fg-color:#008080;" color="#008080" fill="#008080" stroke="#008080" stroke-linecap="round" stroke-width="0.8pt"><path style="fill:none" d="M 0 3.17 C 0.79 1.91 1.25 1.23 2.08 0"></path></g></g></svg>