<html:span id="S3.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<html:span id="S3.SS3.p5.pic1.1.1" class="ltx_p"><html:span id="S3.SS3.p5.pic1.1.1.1" class="ltx_text ltx_underline ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ3:</html:span><html:span id="S3.SS3.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Rule-based traditional approaches, such as PIT and Major, outperform LLMs in time cost. On average, PIT and Major generate a single mutant in just 0.02s and 0.08s, respectively, whereas the best-performing LLM, GPT-4o, requires 1.31s.
In terms of token efficiency, prompt engineering plays an important role.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>