     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,272.97) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 267.07 C 0 270.33 2.64 272.97 5.91 272.97 L 471.47 272.97 C 474.73 272.97 477.38 270.33 477.38 267.07 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 267.07 C 1.97 269.24 3.73 271.01 5.91 271.01 L 471.47 271.01 C 473.65 271.01 475.41 269.24 475.41 267.07 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><ns0:foreignObject style="--ltx-fo-width:31.37em;--ltx-fo-height:17.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="245.42" overflow="visible" transform="matrix(1 0 0 -1 0 241.96)" width="434.07"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S3.SS1.SSS3.p8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<html:span id="S3.SS1.SSS3.p8.pic1.1.1" class="ltx_p"><html:span id="S3.SS1.SSS3.p8.pic1.1.1.1" class="ltx_text ltx_underline ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ1:</html:span><html:span id="S3.SS1.SSS3.p8.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
In most cases, LLM-based approaches outperform traditional methods in effectiveness. For example, the weighted averages of the rule-based approach in terms of real bug detection rate and coupling rate are 41.64% and 24.37%, respectively. In contrast, LLM-based approaches reach 76.47% and 51.54%, representing a significant improvement in both metrics. Specifically, LLMut (DS-671b) achieves the highest real bug detection rate (91.1%) compared to PIT (40.1%) and Major (66.9%). LLMorpheus (DS-671b) achieves the highest coupling rate (51.7%, versus 17.9% for PIT and 42.7% for Major). Moreover, LLM-generated mutants exhibit markedly greater syntactic diversity, introducing a wider range of new AST node types (e.g., 49 for LLMut (DS-671b) and LLMut (DS-236b)) and a lower proportion of deletion mutations (e.g., 0.3% for LLMorpheus (GPT-4o) versus 15.3% for Major).</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>