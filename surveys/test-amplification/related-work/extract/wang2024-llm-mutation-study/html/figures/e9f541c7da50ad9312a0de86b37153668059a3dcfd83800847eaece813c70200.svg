<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" id="S3.SS1.SSS3.p8.pic1" class="ltx_picture" height="272.97" overflow="visible" version="1.1" viewBox="0 0 477.38 272.97" width="477.38"><ns0:style>
  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Print keeps the reader header's logo, not its controls: the theme's own print rule
