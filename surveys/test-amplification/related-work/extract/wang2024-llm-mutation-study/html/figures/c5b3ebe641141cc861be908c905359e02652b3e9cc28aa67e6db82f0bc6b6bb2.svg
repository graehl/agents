<html:span id="S3.SS4.SSS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<html:span id="S3.SS4.SSS2.p2.pic1.1.1" class="ltx_p"><html:span id="S3.SS4.SSS2.p2.pic1.1.1.1" class="ltx_text ltx_underline ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ4:</html:span><html:span id="S3.SS4.SSS2.p2.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
The mutants generated by GPTs have nine main types of compilation errors, with Usage of Unknown Methods and Code Structural Destruction being the most prevalent.
Deletion mutants are not the primary cause of non-compilable code.
An analysis of the surrounding code context where GPTs produce non-compilable mutants reveals that member references and method invocations are the most frequently occurring code features associated with these errors.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>