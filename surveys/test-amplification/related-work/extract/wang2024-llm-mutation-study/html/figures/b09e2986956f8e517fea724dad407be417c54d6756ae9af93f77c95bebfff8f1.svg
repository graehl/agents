<html:span id="S3.SS5.p5.pic1.1.1" class="ltx_p"><html:span id="S3.SS5.p5.pic1.1.1.1" class="ltx_text ltx_underline ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ5:</html:span><html:span id="S3.SS5.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Compared with rule-based approaches, LLM-based approaches tend to generate mutants in code lines that are not covered or not injected by existing test suites, providing valuable guidance for enhancing unit tests.</html:span></html:span>
