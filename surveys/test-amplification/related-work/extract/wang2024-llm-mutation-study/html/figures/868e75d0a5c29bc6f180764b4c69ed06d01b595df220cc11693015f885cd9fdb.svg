<ns0:svg xmlns:html="http://www.w3.org/1999/xhtml" xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns2="http://www.w3.org/1998/Math/MathML" id="S3.SS2.SSS3.p6.pic1" class="ltx_picture" height="205.79" overflow="visible" version="1.1" viewBox="0 0 477.38 205.79" width="477.38"><ns0:style>
  /* Banner pre-dismissal (set above before paint -&gt; no flash-then-hide) and
     reading-mode chrome hiding. */
  html[data-banner-dismissed] .ds-announcement { display: none; }
  html[data-reading-mode="enabled"] .ds-announcement,
  html[data-reading-mode="enabled"] .ds-site-footer { display: none; }
  /* Print keeps the reader header's logo, not its controls: the theme's own print rule
     (header, nav { display: none }) sits in a layer that its header layer outranks. */
  @media print { .arxiv-html-header .html-header-nav { display: none; } }
  /* Keep the announcement text dark on the Open-Blue band in both colour themes
     (otherwise it inherits the paper's warm-wash text in dark mode and washes out). */
  .ds-announcement-text { color: var(--arxiv-ink, #1c1a17); }
</ns0:style><ns0:g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,205.79) matrix(1 0 0 -1 0 0)"><ns0:g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 0 5.91 L 0 199.88 C 0 203.14 2.64 205.79 5.91 205.79 L 471.47 205.79 C 474.73 205.79 477.38 203.14 477.38 199.88 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></ns0:g><ns0:g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><ns0:path style="stroke:none" d="M 1.97 5.91 L 1.97 199.88 C 1.97 202.06 3.73 203.82 5.91 203.82 L 471.47 203.82 C 473.65 203.82 475.41 202.06 475.41 199.88 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><ns0:foreignObject style="--ltx-fo-width:31.37em;--ltx-fo-height:12.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="178.23" overflow="visible" transform="matrix(1 0 0 -1 0 175.54)" width="434.07"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S3.SS2.SSS3.p6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<html:span id="S3.SS2.SSS3.p6.pic1.1.1" class="ltx_p"><html:span id="S3.SS2.SSS3.p6.pic1.1.1.1" class="ltx_text ltx_underline ltx_font_bold" style="--ltx-fg-color:#000000;">Answer to RQ2:</html:span><html:span id="S3.SS2.SSS3.p6.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Rule-based approaches (i.e., PIT and Major) outperform LLMs in compilability rate, duplicate mutant rate, and equivalent mutant rate, with a weighted average of 99.90%, 0.00%, and 1.10%, respectively.
While the weighted average values of LLM-based approaches are 67.17%, 9.38%, and 4.74%. On average, the rule-based approaches produce about 1.5<ns2:math id="S3.SS2.SSS3.p6.pic1.m1" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</ns2:mo><ns2:annotation encoding="application/x-tex">\times</ns2:annotation></ns2:semantics></ns2:math> more compilable mutants and 4-9<ns2:math id="S3.SS2.SSS3.p6.pic1.m2" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">×</ns2:mo><ns2:annotation encoding="application/x-tex">\times</ns2:annotation></ns2:semantics></ns2:math> fewer redundant or equivalent mutants than LLM-based approaches.
Although rule-based approaches are slightly better in terms of equivalent mutant rates, the equivalent mutant rates across approaches remain comparable.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>