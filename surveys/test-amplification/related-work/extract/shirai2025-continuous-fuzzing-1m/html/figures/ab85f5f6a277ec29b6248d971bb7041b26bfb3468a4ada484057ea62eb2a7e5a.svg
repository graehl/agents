<html:span id="S5.SSx2.p6.pic1.1.1" class="ltx_p"><ns2:math id="S5.SSx2.p6.pic1.m1" class="ltx_Math" alttext="RQ_{2}" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</ns2:mi><ns2:mo lspace="0em" rspace="0em">​</ns2:mo><ns2:msub><ns2:mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</ns2:mi><ns2:mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</ns2:mn></ns2:msub></ns2:mrow><ns2:annotation encoding="application/x-tex">RQ_{2}</ns2:annotation></ns2:semantics></ns2:math><html:span id="S5.SSx2.p6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">. <html:span id="S5.SSx2.p6.pic1.1.1.1.1" class="ltx_text ltx_font_italic">Continuous fuzzing steadily increases code coverage, with the most rapid gains occurring early on. While the number of fuzzing iterations and coverage show a strong positive correlation overall, project-level analyses reveal substantial variability influenced by factors like codebase growth.</html:span></html:span></html:span>
