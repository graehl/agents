<html:span id="S2.F2.sf1.pic1.p3.1" class="ltx_p"><html:span id="S2.F2.sf1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Why impossible:<html:span id="S2.F2.sf1.pic1.p3.1.1.1" class="ltx_text ltx_font_medium"> The mutation flips an expected value (<html:span id="S2.F2.sf1.pic1.p3.1.1.1.1" class="ltx_text ltx_font_typewriter">2</html:span> <ns2:math id="S2.F2.sf1.pic1.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</ns2:mo><ns2:annotation encoding="application/x-tex">\rightarrow</ns2:annotation></ns2:semantics></ns2:math> <html:span id="S2.F2.sf1.pic1.p3.1.1.1.2" class="ltx_text ltx_font_typewriter">3</html:span>) contradicting the natural-language spec, so any correct implementation fails this test.</html:span></html:span></html:span>
</html:span></html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>