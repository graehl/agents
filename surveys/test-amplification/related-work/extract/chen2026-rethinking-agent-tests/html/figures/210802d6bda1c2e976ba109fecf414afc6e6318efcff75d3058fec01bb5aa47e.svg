<html:span id="S5.SS1.SSS1.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.97em;">
<html:span id="S5.SS1.SSS1.Px1.p3.pic1.2.1" class="ltx_p"><html:span id="S5.SS1.SSS1.Px1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Prompt interventions can flip test-writing status at scale, yet most tasks keep the same final outcome.
Even large induced or suppressed shifts in test writing therefore appear to be a weak lever on task resolution in this setting.</html:span></html:span>
