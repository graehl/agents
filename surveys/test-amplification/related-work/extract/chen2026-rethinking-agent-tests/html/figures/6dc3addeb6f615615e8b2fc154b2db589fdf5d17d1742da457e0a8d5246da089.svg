<html:span id="S3.SS3.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><html:span id="S3.SS3.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For tasks that write tests, unresolved runs execute them more intensively, and these aggregate differences are statistically significant, while process-level execution failures vary mainly by model.</html:span></html:span>
