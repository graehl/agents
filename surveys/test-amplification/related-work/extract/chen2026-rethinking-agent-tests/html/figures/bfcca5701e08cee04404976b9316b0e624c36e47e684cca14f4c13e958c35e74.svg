_foreignobject_container"><html:span class="ltx_foreignobject_content">
<html:span id="S5.SS2.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.97em;">
<html:span id="S5.SS2.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><html:span id="S5.SS2.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Changing whether agents write tests has much larger effects on efficiency than on task resolution.
Paired Wilcoxon tests and bootstrap confidence intervals support the large discourage-setting savings, while encourage-setting effects are robust for <html:span id="S5.SS2.SSS0.Px2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_italic">GPT-5.2</html:span> but small and statistically unclear for <html:span id="S5.SS2.SSS0.Px2.p2.pic1.2.1.1.2" class="ltx_text ltx_font_italic">Gemini 3 Pro</html:span>.</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>