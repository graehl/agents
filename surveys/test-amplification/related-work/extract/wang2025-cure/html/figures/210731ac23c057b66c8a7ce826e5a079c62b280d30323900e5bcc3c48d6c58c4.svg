<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="780.87" id="S8.SS5.SSS1.p1.pic1" overflow="visible" version="1.1" viewbox="0 0 600 780.87" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,780.87) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 774.97 C 0 778.23 2.64 780.87 5.91 780.87 L 594.09 780.87 C 597.36 780.87 600 778.23 600 774.97 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 759.45 L 598.03 759.45 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 765.36)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Task 1</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 15.7)"><foreignobject color="#000000" height="733.86" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:52.9em;--fo_depth :0.14em;" transform="matrix(1 0 0 -1 0 731.94)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">You are given an array of integers <span class="ltx_text ltx_font_typewriter">nums</span> of length <span class="ltx_text ltx_font_typewriter">n</span>.</span>
<span class="ltx_p">The <span class="ltx_text ltx_font_bold">cost</span> of an array is the value of its first element. For example, the cost of <span class="ltx_text ltx_font_typewriter">[1,2,3]</span> is <span class="ltx_text ltx_font_typewriter">1</span>, while the cost of <span class="ltx_text ltx_font_typewriter">[3,4,1]</span> is <span class="ltx_text ltx_font_typewriter">3</span>.</span>
<span class="ltx_p">You need to divide <span class="ltx_text ltx_font_typewriter">nums</span> into 3 disjoint contiguous subarrays.</span>
<span class="ltx_p">Return the <span class="ltx_text ltx_font_bold">minimum possible sum</span> of the cost of these subarrays.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Example 1:</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
1 2 3 12
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
6
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span> The best possible way to form 3 subarrays is: <span class="ltx_text ltx_font_typewriter">[1]</span>, <span class="ltx_text ltx_font_typewriter">[2]</span>, and <span class="ltx_text ltx_font_typewriter">[3,12]</span> at a total cost of <span class="ltx_text ltx_font_typewriter">1 + 2 + 3 = 6</span>.</span>
<span class="ltx_p">Other possible ways include:</span>
<span class="ltx_itemize" id="S8.I1">
<span class="ltx_item" id="S8.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I1.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1], [2,3], [12]</span> with a cost of <span class="ltx_text ltx_font_typewriter">1 + 2 + 12 = 15</span></span>
</span></span>
<span class="ltx_item" id="S8.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I1.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1,2], [3], [12]</span> with a cost of <span class="ltx_text ltx_font_typewriter">1 + 3 + 12 = 16</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>