<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="779.72" id="S8.SS5.SSS1.p3.pic1" overflow="visible" version="1.1" viewbox="0 0 600 779.72" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,779.72) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 773.81 C 0 777.07 2.64 779.72 5.91 779.72 L 594.09 779.72 C 597.36 779.72 600 777.07 600 773.81 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 758.3 L 598.03 758.3 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 764.2)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Task 2</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject color="#000000" height="732.71" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:52.95em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 732.71)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">You are given a 0-indexed integer array <span class="ltx_text ltx_font_typewriter">batteryPercentages</span> having length <span class="ltx_text ltx_font_typewriter">n</span>, denoting the battery percentages of <span class="ltx_text ltx_font_typewriter">n</span> 0-indexed devices.</span>
<span class="ltx_p">Your task is to test each device <span class="ltx_text ltx_font_typewriter">i</span> in order from <span class="ltx_text ltx_font_typewriter">0</span> to <span class="ltx_text ltx_font_typewriter">n - 1</span>, by performing the following test operations:</span>
<span class="ltx_itemize" id="S8.I4">
<span class="ltx_item" id="S8.I4.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I4.i1.p1">
<span class="ltx_p">If <span class="ltx_text ltx_font_typewriter">batteryPercentages[i]</span> is greater than <span class="ltx_text ltx_font_typewriter">0</span>:</span>
<span class="ltx_itemize" id="S8.I4.i1.I1">
<span class="ltx_item" id="S8.I4.i1.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I4.i1.I1.i1.p1">
<span class="ltx_p">Increment the count of tested devices.</span>
</span></span>
<span class="ltx_item" id="S8.I4.i1.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I4.i1.I1.i2.p1">
<span class="ltx_p">Decrease the battery percentage of all devices with indices <span class="ltx_text ltx_font_typewriter">j</span> in the range <span class="ltx_text ltx_font_typewriter">[i + 1, n - 1]</span> by <span class="ltx_text ltx_font_typewriter">1</span>, ensuring their battery never goes below <span class="ltx_text ltx_font_typewriter">0</span>, i.e., <span class="ltx_text ltx_font_typewriter">batteryPercentages[j] = max(0, batteryPercentages[j] - 1)</span>.</span>
</span></span>
<span class="ltx_item" id="S8.I4.i1.I1.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I4.i1.I1.i3.p1">
<span class="ltx_p">Move to the next device.</span>
</span></span>
</span>
</span></span>
<span class="ltx_item" id="S8.I4.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I4.i2.p1">
<span class="ltx_p">Otherwise, move to the next device without performing any test.</span>
</span></span>
</span>
<span class="ltx_p">Return an integer denoting the number of devices that will be tested after performing the test operations in order.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Example 1:</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
1 1 2 1 3
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
3
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span></span>
<span class="ltx_itemize" id="S8.I5">
<span class="ltx_item" id="S8.I5.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I5.i1.p1">
<span class="ltx_p">At device 0: batteryPercentages[0] &gt; 0, so count = 1. batteryPercentages becomes [1,0,1,0,2]</span>
</span></span>
<span class="ltx_item" id="S8.I5.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I5.i2.p1">
<span class="ltx_p">At device 1: batteryPercentages[1] == 0, skip.</span>
</span></span>
<span class="ltx_item" id="S8.I5.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I5.i3.p1">
<span class="ltx_p">At device 2: batteryPercentages[2] &gt; 0, count = 2. batteryPercentages becomes [1,0,1,0,1]</span>
</span></span>
<span class="ltx_item" id="S8.I5.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I5.i4.p1">
<span class="ltx_p">At device 3: batteryPercentages[3] == 0, skip.</span>
</span></span>
<span class="ltx_item" id="S8.I5.i5" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I5.i5.p1">
<span class="ltx_p">At device 4: batteryPercentages[4] &gt; 0, count = 3.</span>
</span></span>
</span>
<span class="ltx_p">So the answer is <span class="ltx_text ltx_font_typewriter">3</span>.</span>
</span></span></span></foreignobject></g></g></svg>