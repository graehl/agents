<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="1131.22" id="S8.SS5.SSS1.p6.pic1" overflow="visible" version="1.1" viewbox="0 0 600 1131.22" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,1131.22) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 1125.31 C 0 1128.57 2.64 1131.22 5.91 1131.22 L 594.09 1131.22 C 597.36 1131.22 600 1128.57 600 1125.31 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 1109.8 L 598.03 1109.8 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1115.7)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Generated unit test for task 3</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject color="#000000" height="1084.21" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:78.16em;--fo_depth :0.19em;" transform="matrix(1 0 0 -1 0 1081.52)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Let’s consider an input where we have multiple elements with different frequencies. For instance, an array with several <span class="ltx_text ltx_font_typewriter">2</span>s and <span class="ltx_text ltx_font_typewriter">3</span>s, and a few <span class="ltx_text ltx_font_typewriter">1</span>s and <span class="ltx_text ltx_font_typewriter">4</span>s.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
1 2 2 3 3 3 4 4 4 4
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Step-by-Step Computation:</span></span>
<span class="ltx_itemize" id="S8.I8">
<span class="ltx_item" id="S8.I8.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I8.i1.p1">
<span class="ltx_p">Count the frequency of each element:</span>
<span class="ltx_itemize" id="S8.I8.i1.I1">
<span class="ltx_item" id="S8.I8.i1.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I8.i1.I1.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">1</span>: 1 time</span>
</span></span>
<span class="ltx_item" id="S8.I8.i1.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I8.i1.I1.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">2</span>: 2 times</span>
</span></span>
<span class="ltx_item" id="S8.I8.i1.I1.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I8.i1.I1.i3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">3</span>: 3 times</span>
</span></span>
<span class="ltx_item" id="S8.I8.i1.I1.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I8.i1.I1.i4.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">4</span>: 4 times</span>
</span></span>
</span>
</span></span>
<span class="ltx_item" id="S8.I8.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I8.i2.p1">
<span class="ltx_p">Maximum frequency = <span class="ltx_text ltx_font_typewriter">4</span> (from element <span class="ltx_text ltx_font_typewriter">4</span>)</span>
</span></span>
<span class="ltx_item" id="S8.I8.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I8.i3.p1">
<span class="ltx_p">Only element <span class="ltx_text ltx_font_typewriter">4</span> has this maximum frequency.</span>
</span></span>
</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
4
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span> The element <span class="ltx_text ltx_font_typewriter">4</span> appears <span class="ltx_text ltx_font_typewriter">4</span> times, and this is the highest frequency in the array. Therefore, the total number of elements with the maximum frequency is <span class="ltx_text ltx_font_typewriter">4</span>.</span>
</span></span></span></foreignobject></g></g></svg>