<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="732.1" id="S8.SS5.SSS1.p7.pic1" overflow="visible" version="1.1" viewbox="0 0 600 732.1" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,732.1) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 726.2 C 0 729.46 2.64 732.1 5.91 732.1 L 594.09 732.1 C 597.36 732.1 600 729.46 600 726.2 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 710.68 L 598.03 710.68 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 716.59)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Task 4</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject color="#000000" height="685.09" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:49.32em;--fo_depth :0.19em;" transform="matrix(1 0 0 -1 0 682.4)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">You are given an array of integers <span class="ltx_text ltx_font_typewriter">nums</span> of length <span class="ltx_text ltx_font_typewriter">n</span>.</span>
<span class="ltx_p">The <span class="ltx_text ltx_font_bold">cost</span> of an array is the value of its first element. For example, the cost of <span class="ltx_text ltx_font_typewriter">[1,2,3]</span> is <span class="ltx_text ltx_font_typewriter">1</span>, while the cost of <span class="ltx_text ltx_font_typewriter">[3,4,1]</span> is <span class="ltx_text ltx_font_typewriter">3</span>.</span>
<span class="ltx_p">You need to divide <span class="ltx_text ltx_font_typewriter">nums</span> into 3 disjoint contiguous subarrays.</span>
<span class="ltx_p">Return the <span class="ltx_text ltx_font_bold">minimum possible sum</span> of the cost of these subarrays.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Example 1:</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
1 2 3 12
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
6
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span></span>
<span class="ltx_itemize" id="S8.I9">
<span class="ltx_item" id="S8.I9.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I9.i1.p1">
<span class="ltx_p">The best way to partition is <span class="ltx_text ltx_font_typewriter">[1]</span>, <span class="ltx_text ltx_font_typewriter">[2]</span>, <span class="ltx_text ltx_font_typewriter">[3,12]</span> with a total cost: <span class="ltx_text ltx_font_typewriter">1 + 2 + 3 = 6</span>.</span>
</span></span>
<span class="ltx_item" id="S8.I9.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I9.i2.p1">
<span class="ltx_p">Other possibilities:</span>
<span class="ltx_itemize" id="S8.I9.i2.I1">
<span class="ltx_item" id="S8.I9.i2.I1.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I9.i2.I1.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1], [2,3], [12]</span> → cost = <span class="ltx_text ltx_font_typewriter">1 + 2 + 12 = 15</span></span>
</span></span>
<span class="ltx_item" id="S8.I9.i2.I1.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item"><span class="ltx_text ltx_font_bold">–</span></span>
<span class="ltx_para" id="S8.I9.i2.I1.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1,2], [3], [12]</span> → cost = <span class="ltx_text ltx_font_typewriter">1 + 3 + 12 = 16</span></span>
</span></span>
</span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>