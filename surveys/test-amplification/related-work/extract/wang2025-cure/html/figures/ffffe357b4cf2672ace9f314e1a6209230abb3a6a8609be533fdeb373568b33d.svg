<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="1520.24" id="S8.SS5.SSS1.p8.pic1" overflow="visible" version="1.1" viewbox="0 0 600 1520.24" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,1520.24) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 1514.33 C 0 1517.59 2.64 1520.24 5.91 1520.24 L 594.09 1520.24 C 597.36 1520.24 600 1517.59 600 1514.33 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 1498.82 L 598.03 1498.82 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1504.72)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Generated unit test for task 4</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject color="#000000" height="1473.23" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:106.47em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 1473.23)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p"><span class="ltx_text ltx_font_bold">1. Designing the Input:</span></span>
<span class="ltx_itemize" id="S8.I10">
<span class="ltx_item" id="S8.I10.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I10.i1.p1">
<span class="ltx_p">Use an array of length 5 to explore multiple partitioning scenarios.</span>
</span></span>
<span class="ltx_item" id="S8.I10.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I10.i2.p1">
<span class="ltx_p">Mix small and large integers for diversity.</span>
</span></span>
</span>
<span class="ltx_p">Consider the array <span class="ltx_text ltx_font_typewriter">[4, 1, 5, 2, 6]</span>.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">2. Computing the Output:</span> Try all valid 3-way partitions:</span>
<span class="ltx_itemize" id="S8.I11">
<span class="ltx_item" id="S8.I11.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4], [1], [5, 2, 6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 1 + 5 = 10</span></span>
</span></span>
<span class="ltx_item" id="S8.I11.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4], [1, 5], [2, 6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 1 + 2 = 7</span></span>
</span></span>
<span class="ltx_item" id="S8.I11.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4], [1, 5, 2], [6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 1 + 6 = 11</span></span>
</span></span>
<span class="ltx_item" id="S8.I11.i4" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i4.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4, 1], [5], [2, 6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 5 + 2 = 11</span></span>
</span></span>
<span class="ltx_item" id="S8.I11.i5" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i5.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4, 1], [5, 2], [6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 5 + 6 = 15</span></span>
</span></span>
<span class="ltx_item" id="S8.I11.i6" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I11.i6.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4, 1, 5], [2], [6]</span> → cost = <span class="ltx_text ltx_font_typewriter">4 + 2 + 6 = 12</span></span>
</span></span>
</span>
<span class="ltx_p">Minimum cost = <span class="ltx_text ltx_font_typewriter">7</span> from partition <span class="ltx_text ltx_font_typewriter">[4], [1, 5], [2, 6]</span>.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
4 1 5 2 6
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
7
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span> The optimal partition is:</span>
<span class="ltx_itemize" id="S8.I12">
<span class="ltx_item" id="S8.I12.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I12.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[4]</span> → cost = 4</span>
</span></span>
<span class="ltx_item" id="S8.I12.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I12.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1, 5]</span> → cost = 1</span>
</span></span>
<span class="ltx_item" id="S8.I12.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I12.i3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[2, 6]</span> → cost = 2</span>
</span></span>
</span>
<span class="ltx_p">Total cost: <span class="ltx_text ltx_font_typewriter">4 + 1 + 2 = 7</span>.</span>
</span></span></span></foreignobject></g></g></svg>