<svg xmlns="http://www.w3.org/2000/svg" class="ltx_picture" height="1349" id="S8.SS5.SSS1.p2.pic1" overflow="visible" version="1.1" viewbox="0 0 600 1349" width="600"><g fill="#000000" stroke="#000000" stroke-width="0.4pt" style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" transform="translate(0,1349) matrix(1 0 0 -1 0 0)"><g fill="#404040" fill-opacity="1.0" style="--ltx-fill-color:#404040;"><path d="M 0 5.91 L 0 1343.09 C 0 1346.35 2.64 1349 5.91 1349 L 594.09 1349 C 597.36 1349 600 1346.35 600 1343.09 L 600 5.91 C 600 2.64 597.36 0 594.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" style="stroke:none"></path></g><g fill="#F2F2FF" fill-opacity="1.0" style="--ltx-fill-color:#F2F2FF;"><path d="M 1.97 5.91 L 1.97 1327.58 L 598.03 1327.58 L 598.03 5.91 C 598.03 3.73 596.27 1.97 594.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" style="stroke:none"></path></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1333.48)"><foreignobject color="#FFFFFF" height="9.61" overflow="visible" style="--ltx-fg-color:#FFFFFF;--fo_width :40.23em;--fo_height:0.69em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 9.61)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">Generated unit test for task 1</span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject color="#000000" height="1301.98" overflow="visible" style="--ltx-fg-color:#000000;--fo_width :40.23em;--fo_height:94.09em;--fo_depth :0em;" transform="matrix(1 0 0 -1 0 1301.98)" width="556.69"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:40.23em;">
<span class="ltx_p">1. Start with a simple input and compute the output step by step.</span>
<span class="ltx_p">2. Let’s take the input as <span class="ltx_text ltx_font_typewriter">[2, 3, 4, 1]</span>.</span>
<span class="ltx_p">3. According to the rules:</span>
<span class="ltx_itemize" id="S8.I2">
<span class="ltx_item" id="S8.I2.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I2.i1.p1">
<span class="ltx_p">The array needs to be divided into three disjoint contiguous subarrays.</span>
</span></span>
<span class="ltx_item" id="S8.I2.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I2.i2.p1">
<span class="ltx_p">The cost is defined as the first element of each subarray.</span>
</span></span>
</span>
<span class="ltx_p">Let’s think through the possible ways to divide the array <span class="ltx_text ltx_font_typewriter">[2, 3, 4, 1]</span> into three subarrays:</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Option 1:</span> <span class="ltx_text ltx_font_typewriter">[2], [3], [4, 1]</span></span>
<span class="ltx_p">Cost: <span class="ltx_text ltx_font_typewriter">2 + 3 + 4 = 9</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Option 2:</span> <span class="ltx_text ltx_font_typewriter">[2, 3], [4], [1]</span></span>
<span class="ltx_p">Cost: <span class="ltx_text ltx_font_typewriter">2 + 4 + 1 = 7</span></span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Option 3:</span> <span class="ltx_text ltx_font_typewriter">[2], [3, 4], [1]</span></span>
<span class="ltx_p">Cost: <span class="ltx_text ltx_font_typewriter">2 + 3 + 1 = 6</span></span>
<span class="ltx_p">After comparing all options, the minimum cost is from <span class="ltx_text ltx_font_typewriter">[2], [3, 4], [1]</span> yielding a cost of <span class="ltx_text ltx_font_typewriter">6</span>.</span>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Input:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
2 3 4 1
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Test Output:</span></span><pre class="ltx_verbatim ltx_font_typewriter">
6
</pre>
<span class="ltx_p"><span class="ltx_text ltx_font_bold">Explanation:</span> The optimal way to divide the array <span class="ltx_text ltx_font_typewriter">[2, 3, 4, 1]</span> is:</span>
<span class="ltx_itemize" id="S8.I3">
<span class="ltx_item" id="S8.I3.i1" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I3.i1.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[2]</span> with a cost of <span class="ltx_text ltx_font_typewriter">2</span>,</span>
</span></span>
<span class="ltx_item" id="S8.I3.i2" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I3.i2.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[3, 4]</span> with a cost of <span class="ltx_text ltx_font_typewriter">3</span>,</span>
</span></span>
<span class="ltx_item" id="S8.I3.i3" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span>
<span class="ltx_para" id="S8.I3.i3.p1">
<span class="ltx_p"><span class="ltx_text ltx_font_typewriter">[1]</span> with a cost of <span class="ltx_text ltx_font_typewriter">1</span>.</span>
</span></span>
</span>
<span class="ltx_p">Total cost: <span class="ltx_text ltx_font_typewriter">2 + 3 + 1 = 6</span>.</span>
</span></span></span></foreignobject></g></g></svg>