# Metadata manifest for surveys/asr-lm-fusion.
#
# One entry per paper the field map references. `verified: true` means the
# citation was checked against a fetched source THIS repo can regenerate
# (here: the arXiv API record, ACL Anthology BibTeX, dblp or OpenAlex,
# named in `source` when not arXiv); `verified: false` means it is
# pretrained-recall reconstruction and the arxiv/venue/year/authors must be
# confirmed on a grounded pass. Do not cite a verified:false entry as
# authoritative.
#
# Clusters: causal-lms, rescoring, lm-aware-training, data-scale.
#
# `read:` records what was actually read when it is less than a committed
# extract (saved HTML, abstract only, or not read). PDF-only papers were not
# read in this pass: marker-pdf on the GPU was out of scope and CPU
# extraction was abandoned as too slow under host load.
#
# Fields: key, title, authors, venue, year, arxiv/url, grounded (source
# fetched?), verified (citation checked?), source (where a verified but
# ungrounded citation was checked), fetched (date or null), short + concept_page
# (once the paper earns a digest), cluster (survey.md section).
#
# Extracts are keyed by `key`, never by `short`: a short handle is assigned
# later, and rekeying would orphan every extract a concept page cites.
# Build and check them with `related-work fetch` / `related-work audit`.

