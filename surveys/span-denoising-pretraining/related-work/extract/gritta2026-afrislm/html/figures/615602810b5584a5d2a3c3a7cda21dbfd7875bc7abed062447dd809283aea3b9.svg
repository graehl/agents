</html:span><html:span id="A2.F9.pic1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">TARGET_LANG</html:span><html:span id="A2.F9.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">: </html:span><html:span id="A2.F9.pic1.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">SOURCE_TEXT</html:span><html:span id="A2.F9.pic1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">. Translation:</html:span></html:span>
