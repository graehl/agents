<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation of one transfer: (1) extract the donor’s representation, (2) rotate and scale it, (3) swap it into the recipient"><style>.katex svg{fill:currentColor;stroke:currentColor;fill-rule:nonzero;fill-opacity:1;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;display:block;height:inherit;position:absolute;width:100%}.Post_linkButton__fKycd img,.Post_linkButton__fKycd svg{
    margin-right: var(--xs)
}.anim-stage svg{
  display: block;
  width: 100%;
  height: auto;
}#kv svg{  
  display: block;
  width: 100%;
  height: auto;
  margin: 0 auto;
  font-family: inherit;
}#kv svg.wide{
  max-width: 560px;
}#kv svg.narrow{
