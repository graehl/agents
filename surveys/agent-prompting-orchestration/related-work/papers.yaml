# Metadata manifest for surveys/agent-prompting-orchestration.
#
# Built and checked by the shared `related-work` engine (scripts/related-work
# in ~/agents; contract topics/research-survey.md): `related-work fetch` builds
# extracts under ./extract/<key>/, `related-work audit` validates citation
# metadata and reconciles this file against them, and `related-work status`
# derives survey.md's grounding banner.
#
# One entry per paper the field map references. `verified: true` means the
# citation was checked against a fetched source THIS repo can regenerate;
# `verified: false` means it is pretrained-recall reconstruction and the
# arxiv/venue/year/authors must be confirmed on a grounded pass. Do not cite
# a verified:false entry as authoritative.
#
# 2026-08-15 falsification slice: entries marked verified below were checked
# by prompted full-text reads of the arXiv HTML pages that day (title, authors,
# id, year, and the content claims cited in survey.md/frontier.md).
#
# Extracts are keyed by `key`, never by `short`: a short handle is assigned
# later, and rekeying would orphan every extract a concept page cites.

meta:
  field_slug: agent-prompting-orchestration
  coverage_cutoff: 2026-08-15
  grounding_mode: grounded-in-progress
  model_training_cutoff: 2026-01

