<html:span id="A4.T14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.97em;">
<html:span id="A4.T14.pic1.1.1" class="ltx_p"><html:span id="A4.T14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Phase-Adherence Judge</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.58 16.1)"><ns0:foreignObject style="--ltx-fo-width:44.81em;--ltx-fo-height:34.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="486.3" overflow="visible" transform="matrix(1 0 0 -1 0 482.84)" width="620.04"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content"><html:span id="A4.T14.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.81em;">
<html:span id="A4.T14.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="A4.T14.pic1.p1.1" class="ltx_p"><html:span id="A4.T14.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Role:</html:span><html:span id="A4.T14.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> You are evaluating how closely an LLM agent adheres to a fixed procedural rubric across the successive phases of its trajectory. Apply the rubric exactly as given; do not add or remove instructions. The trajectory is BLINDED: every model-family token has been replaced with </html:span><html:span id="A4.T14.pic1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;MODEL&gt;</html:span><html:span id="A4.T14.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. Judge adherence from observable actions only. Output JSON only, no prose.</html:span></html:span>
</html:span>
<html:span id="A4.T14.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="A4.T14.pic1.p2.1" class="ltx_p"><html:span id="A4.T14.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Inputs:</html:span><html:span id="A4.T14.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The locked rubric JSON (</html:span><html:span id="A4.T14.pic1.p2.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{rubric_json}</html:span><html:span id="A4.T14.pic1.p2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">) and the blinded trajectory (</html:span><html:span id="A4.T14.pic1.p2.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">{trajectory_text}</html:span><html:span id="A4.T14.pic1.p2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">).</html:span></html:span>
</html:span>
<html:span id="A4.T14.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="A4.T14.pic1.p3.1" class="ltx_p"><html:span id="A4.T14.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.</html:span><html:span id="A4.T14.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Partition the trajectory into five turn-position phases: </html:span><html:span id="A4.T14.pic1.p3.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">skill_loaded</html:span><html:span id="A4.T14.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </html:span><ns2:math id="A4.T14.pic1.p3.m1" class="ltx_Math" alttext="=" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:annotation encoding="application/x-tex">=</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> turn 1; </html:span><html:span id="A4.T14.pic1.p3.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">first_action</html:span><html:span id="A4.T14.pic1.p3.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> </html:span><ns2:math id="A4.T14.pic1.p3.m2" class="ltx_Math" alttext="=" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:annotation encoding="application/x-tex">=</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> first action turn after; </html:span><html:span id="A4.T14.pic1.p3.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">midpoint</html:span><html:span id="A4.T14.pic1.p3.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> </html:span><ns2:math id="A4.T14.pic1.p3.m3" class="ltx_Math" alttext="=" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:annotation encoding="application/x-tex">=</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> middle 50% of turns; </html:span><html:span id="A4.T14.pic1.p3.1.12" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">pre_final</html:span><html:span id="A4.T14.pic1.p3.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> </html:span><ns2:math id="A4.T14.pic1.p3.m4" class="ltx_Math" alttext="=" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:annotation encoding="application/x-tex">=</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> last 25% excluding the final turn; </html:span><html:span id="A4.T14.pic1.p3.1.15" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">final_validation</html:span><html:span id="A4.T14.pic1.p3.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> </html:span><ns2:math id="A4.T14.pic1.p3.m5" class="ltx_Math" alttext="=" display="inline" intent=":literal"><ns2:semantics><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</ns2:mo><ns2:annotation encoding="application/x-tex">=</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> final turn. For each phase, output one adherence score in </html:span><ns2:math id="A4.T14.pic1.p3.m6" class="ltx_Math" alttext="[0,1]" display="inline" intent=":literal"><ns2:semantics><ns2:mrow><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</ns2:mo><ns2:mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</ns2:mn><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</ns2:mo><ns2:mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</ns2:mn><ns2:mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</ns2:mo></ns2:mrow><ns2:annotation encoding="application/x-tex">[0,1]</ns2:annotation></ns2:semantics></ns2:math><html:span id="A4.T14.pic1.p3.1.18" class="ltx_text" style="--ltx-fg-color:#000000;"> measuring how well the agent’s actions within that phase’s turns follow the rubric instructions in scope during that phase. A score of 1.0 means every in-scope, observable rubric instruction in that phase was followed; 0.0 means none were.</html:span></html:span>
</html:span>
<html:span id="A4.T14.pic1.p4" class="ltx_para ltx_noindent">
<html:span id="A4.T14.pic1.p4.1" class="ltx_p"><html:span id="A4.T14.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (JSON only):</html:span></html:span>
<html:span id="A4.T14.pic1.p4.2" class="ltx_listing ltx_lstlisting ltx_listing"><html:span class="ltx_listing_data"><html:a href="data:text/plain;base64," download="">⬇</html:a></html:span>
