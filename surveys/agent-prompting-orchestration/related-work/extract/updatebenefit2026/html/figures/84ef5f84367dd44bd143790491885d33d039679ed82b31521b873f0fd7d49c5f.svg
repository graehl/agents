</html:span>
<html:span id="lstnumberx33" class="ltx_listingline"><html:span id="lstnumberx33.1" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;">    </html:span><html:span id="lstnumberx33.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">"</html:span><html:span id="lstnumberx33.3" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">first_action</html:span><html:span id="lstnumberx33.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">":</html:span><html:span id="lstnumberx33.5" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </html:span><html:span id="lstnumberx33.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">0.0,</html:span>
</html:span>
<html:span id="lstnumberx34" class="ltx_listingline"><html:span id="lstnumberx34.1" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;">    </html:span><html:span id="lstnumberx34.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">"</html:span><html:span id="lstnumberx34.3" class="ltx_text ltx_lst_identifier ltx_font_typewriter" style="--ltx-fg-color:#000000;">midpoint</html:span><html:span id="lstnumberx34.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">":</html:span><html:span id="lstnumberx34.5" class="ltx_text ltx_lst_space ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </html:span><html:span id="lstnumberx34.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">0.0,</html:span>
