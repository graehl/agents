<html:span id="A4.T11.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.97em;">
<html:span id="A4.T11.pic1.1.1" class="ltx_p"><html:span id="A4.T11.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Evolver per-cycle user message template</html:span></html:span>
</html:span></html:span></html:span></ns0:foreignObject></ns0:g><ns0:g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.58 143.25)"><ns0:foreignObject style="--ltx-fo-width:44.81em;--ltx-fo-height:22.58em;--ltx-fo-depth:9.44em;font-size:10pt;" height="443.1" overflow="visible" transform="matrix(1 0 0 -1 0 312.49)" width="620.04"><html:span class="ltx_foreignobject_container"><html:span class="ltx_foreignobject_content"><html:span id="A4.T11.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.81em;">
<html:span id="A4.T11.pic1.p1" class="ltx_para ltx_noindent">
<html:span id="A4.T11.pic1.p1.1" class="ltx_p"><html:span id="A4.T11.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Workspace scope.</html:span><html:span id="A4.T11.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
</html:span><html:span id="A4.T11.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">[A benchmark-specific permission block specifies which harness artifacts may be edited.
SWE-bench Verified and SkillsBench allow edits to <html:span id="A4.T11.pic1.p1.1.3.1" class="ltx_text ltx_font_typewriter">skills/</html:span>.
MCP-Atlas allows edits to <html:span id="A4.T11.pic1.p1.1.3.2" class="ltx_text ltx_font_typewriter">prompts/</html:span> and <html:span id="A4.T11.pic1.p1.1.3.3" class="ltx_text ltx_font_typewriter">skills/</html:span>, and append-only updates to <html:span id="A4.T11.pic1.p1.1.3.4" class="ltx_text ltx_font_typewriter">memory/</html:span>.
The <html:span id="A4.T11.pic1.p1.1.3.5" class="ltx_text ltx_font_typewriter">tools/</html:span> directory is read-only for all benchmarks.]</html:span></html:span>
</html:span>
<html:span id="A4.T11.pic1.p2" class="ltx_para ltx_noindent">
<html:span id="A4.T11.pic1.p2.1" class="ltx_p"><html:span id="A4.T11.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Execution evidence.</html:span><html:span id="A4.T11.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
</html:span><html:span id="A4.T11.pic1.p2.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">[The message includes a canonicalized JSON payload containing the current batch’s task identifiers, trajectories, outputs, scores, and grader feedback.]</html:span></html:span>
</html:span>
<html:span id="A4.T11.pic1.p3" class="ltx_para ltx_noindent">
<html:span id="A4.T11.pic1.p3.1" class="ltx_p"><html:span id="A4.T11.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Editing instructions.</html:span><html:span id="A4.T11.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
</html:span><html:span id="A4.T11.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#0000FF;">[The evolver is instructed to:</html:span></html:span>
<html:span id="A4.I8" class="ltx_itemize ltx_leftmargin_flush">
<html:span id="A4.I8.i1" class="ltx_item" style="list-style-type:none;"><html:span class="ltx_tag ltx_tag_item">•</html:span> 
<html:span id="A4.I8.i1.p1" class="ltx_para">
<html:span id="A4.I8.i1.p1.1" class="ltx_p"><html:span id="A4.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">analyze the evidence for recurring failures and reusable patterns;</html:span></html:span>
</html:span></html:span>
<html:span id="A4.I8.i2" class="ltx_item" style="list-style-type:none;"><html:span class="ltx_tag ltx_tag_item">•</html:span> 
<html:span id="A4.I8.i2.p1" class="ltx_para">
<html:span id="A4.I8.i2.p1.1" class="ltx_p"><html:span id="A4.I8.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">edit only artifacts allowed by the workspace scope;</html:span></html:span>
</html:span></html:span>
<html:span id="A4.I8.i3" class="ltx_item" style="list-style-type:none;"><html:span class="ltx_tag ltx_tag_item">•</html:span> 
<html:span id="A4.I8.i3.p1" class="ltx_para">
<html:span id="A4.I8.i3.p1.1" class="ltx_p"><html:span id="A4.I8.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">prefer small, targeted harness updates over broad rewrites;</html:span></html:span>
</html:span></html:span>
<html:span id="A4.I8.i4" class="ltx_item" style="list-style-type:none;"><html:span class="ltx_tag ltx_tag_item">•</html:span> 
<html:span id="A4.I8.i4.p1" class="ltx_para">
<html:span id="A4.I8.i4.p1.1" class="ltx_p"><html:span id="A4.I8.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">use the workspace tool to inspect and modify files;</html:span></html:span>
</html:span></html:span>
<html:span id="A4.I8.i5" class="ltx_item" style="list-style-type:none;"><html:span class="ltx_tag ltx_tag_item">•</html:span> 
<html:span id="A4.I8.i5.p1" class="ltx_para">
<html:span id="A4.I8.i5.p1.1" class="ltx_p"><html:span id="A4.I8.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">check the resulting changes before finishing.</html:span></html:span>
</html:span></html:span>
</html:span>
<html:span id="A4.T11.pic1.p3.2" class="ltx_p"><html:span id="A4.T11.pic1.p3.2.1" class="ltx_text" style="--ltx-fg-color:#0000FF;">]</html:span></html:span>
</html:span></html:span></html:span></html:span></ns0:foreignObject></ns0:g></ns0:g></ns0:svg>