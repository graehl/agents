target-version = "py310"

[lint.per-file-ignores]
"agentctl.py" = [
  # Plugin, process, and filesystem boundaries deliberately contain failures.
  "BLE001",
  # Best-effort discovery paths intentionally skip unreadable candidates.
  "S110",
  "S112",
  # Malformed declaration JSON is a bad value, not a caller type error.
  "TRY004",
]
"scripts/reviews" = [
  # tomllib is stdlib from 3.11, so the py310 target above sorts it as
  # third-party; the import block is correct for the 3.11 the script needs.
  "I001",
]
"tests/test_*.py" = [
  # The suite runner catches every test failure to report the complete set.
  "BLE001",
  # Tests inspect return codes explicitly, including expected failures.
  "PLW1510",
]
