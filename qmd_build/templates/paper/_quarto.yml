project:
  type: default
  output-dir: _build
  render:
    - index.qmd

resource-path:
  - .

# Table-note markers (`^a^` in a cell, `^a^ ...` notes below the table)
# become links in HTML (~/agents/topics/document-writing.md).
filters:
  - {{qmd_build}}/table_notes.lua
  # Term definitions and their previews. This entry is the paper's one
  # registration: `quarto render`, qmd-html and qmd-arxiv all run it from here.
  - {{qmd_build}}/term_hints.lua
  # PDF only: size pipe-table columns from content, not separator dashes.
  - {{qmd_build}}/latex_table_widths.lua

link-citations: true
# Numbered sections, so `@sec-` cross-references render as "Section 3".
number-sections: true

format:
  html:
    embed-resources: true
    # Page-wide tables cover the margin TOC rather than print over it.
    css: {{qmd_build}}/paper.css
    default-image-extension: svg
    fig-responsive: true
    footnotes-hover: true
    crossrefs-hover: true
    citations-hover: true
  pdf:
    # US Letter, and pdfLaTeX: the only engine arXiv documents
    # (~/agents/topics/arxiv-submission.md).
    papersize: letter
    # A list: Quarto 1.9 crashes on a scalar geometry once a
    # `.column-screen-inset` table enables its margin layout, which this
    # explicit geometry also keeps off every PDF page.
    geometry:
      - margin=1in
    pdf-engine: pdflatex
    default-image-extension: pdf
    keep-tex: true
    # pdfLaTeX rejects Unicode characters it has no mapping for; map the
    # ones prose commonly uses.
    include-in-header:
      text: |
        \DeclareUnicodeCharacter{2212}{\ensuremath{-}}
        \DeclareUnicodeCharacter{2192}{\ensuremath{\rightarrow}}
        \DeclareUnicodeCharacter{2248}{\ensuremath{\approx}}
        \DeclareUnicodeCharacter{00D7}{\ensuremath{\times}}
        \DeclareUnicodeCharacter{2264}{\ensuremath{\leq}}
        \DeclareUnicodeCharacter{2265}{\ensuremath{\geq}}
