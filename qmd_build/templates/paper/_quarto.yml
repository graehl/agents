project:
  type: default
  output-dir: _build
  render:
    - index.qmd

resource-path:
  - .

link-citations: true

format:
  html:
    embed-resources: true
    default-image-extension: svg
    fig-responsive: true
    footnotes-hover: true
    crossrefs-hover: true
    citations-hover: true
  pdf:
    # US Letter, and pdfLaTeX: the only engine arXiv documents
    # (~/agents/topics/arxiv-submission.md).
    papersize: letter
    geometry: margin=1in
    pdf-engine: pdflatex
    default-image-extension: pdf
    keep-tex: true
